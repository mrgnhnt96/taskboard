/* ---------- Today's app: its current values, only for the comparison rows ---------- */
.today-c, .dlg-old, tr.today {
  --o-bg: light-dark(#f6f7f9, #0f1216);
  --o-card: light-dark(#ffffff, #1a1f26);
  --o-panel2: light-dark(#f0f2f5, #232932);
  --o-seg: light-dark(#e9ecf0, #232931);

  --o-border: light-dark(#e2e6eb, #2a3039);
  --o-border2: light-dark(#cfd5dd, #3a424d);
  --o-accent: light-dark(#3563e9, #7c9cff);
  --o-accent-btn: light-dark(#3563e9, #4d72f0);
  --o-accent-soft: light-dark(#e8eefd, #1f2a47);

  --o-accent-line: light-dark(#d5e0fb, #2b3a63);
  --o-warn-soft: light-dark(#fdece3, #3a2415);

  --o-up-soft: light-dark(#e3f4ea, #16301f);

  --o-results: light-dark(#0e7490, #4fc3d9);
  --o-results-soft: light-dark(#e0f3f7, #123139);
  --o-down: light-dark(#b42318, #f47067);
  --o-down-soft: light-dark(#fde8e7, #3b1a19);
  --o-down-line: light-dark(#f1c7c3, #6a2a27);
  --o-goal: light-dark(#5b3fc4, #a996f5);
  --o-goal-soft: light-dark(#f1edfd, #2a2347);
  --o-shadow: light-dark(#1018281f, #00000080);
}

.o-bg-page { background: var(--o-bg); }

/* ---------- Page ---------- */
[data-screen="kit"] { position: relative; background: var(--color-surface); color: var(--color-on-surface); font-family: var(--type-body-font-family); font-size: var(--type-body-font-size); line-height: var(--type-body-line-height); scroll-padding-top: 72px; }
.layout { display: grid; grid-template-columns: 1fr; }
.toc { display: none; }
.topbar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: var(--space-gap-group); padding: var(--space-inset-sm) var(--space-inset-md); background: var(--color-surface); border-bottom: var(--border-width) solid var(--color-divider); }
.content { padding: var(--space-inset-lg) var(--space-inset-md) 160px; min-width: 0; max-width: 105rem; display: grid; gap: var(--space-gap-section); }
@container screen (width >= 840px) {
  [data-screen="kit"] { scroll-padding-top: var(--space-inset-lg); }
  .layout { grid-template-columns: var(--size-sidebar) minmax(0, 1fr); }
  .topbar { display: none; }
  .toc { display: block; position: sticky; top: 0; align-self: start; height: 100cqh; overflow-y: auto; padding: var(--space-inset-lg) var(--space-inset-sm); border-right: var(--border-width) solid var(--color-divider); }
  .content { padding: var(--space-page-margin) var(--space-page-margin) 160px; }
}
.toc-h { padding: 0 var(--space-inset-sm) var(--space-inset-md); }
.toc ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.toc-i { width: 100%; text-align: left; min-height: var(--size-control); padding: 0 var(--space-inset-sm); border-radius: var(--radius-control); font-family: var(--type-label-font-family); font-size: var(--type-label-font-size); font-weight: var(--type-label-font-weight); color: var(--color-on-surface-variant); }
.toc-i:hover { background: var(--color-surface-hover); color: var(--color-on-surface); }
.toc-i[aria-current="true"] { color: var(--color-on-surface); font-weight: 700; background: var(--color-surface-container); }
.toc-i:focus-visible { outline: var(--focus-width) solid var(--color-focus-ring); outline-offset: calc(var(--focus-width) * -1); }
.part { display: grid; gap: var(--space-gap-group); min-width: 0; }
.rules { margin: 0; padding: 0 0 0 var(--space-inset-md); display: grid; gap: var(--space-inset-xs); max-width: 46rem; font-size: var(--type-reading-font-size); line-height: var(--type-reading-line-height); color: var(--color-on-surface); }
.sub { color: var(--color-on-surface-variant); margin-bottom: var(--space-inset-sm); }
details.more { max-width: 60rem; }
details.more > summary { cursor: default; width: fit-content; padding: var(--space-inset-xs) var(--space-inset-sm); margin-left: calc(var(--space-inset-sm) * -1); border-radius: var(--radius-control); font-family: var(--type-label-font-family); font-size: var(--type-label-font-size); font-weight: var(--type-label-font-weight); color: var(--color-link); }
details.more > summary:hover { background: var(--color-surface-hover); }
details.more > summary:focus-visible { outline: var(--focus-width) solid var(--color-focus-ring); outline-offset: var(--focus-offset); }
details.more[open] > summary { margin-bottom: var(--space-inset-sm); }

/* panes: one forced light, one forced dark */
.pair { display: grid; gap: var(--space-gap-group); }
.pane { min-width: 0; padding: var(--space-inset-md); border-radius: var(--radius-container); background: var(--color-surface); color: var(--color-on-surface); border: var(--border-width) solid var(--color-divider); }
.pane[data-pane="light"] { color-scheme: light; }
.pane[data-pane="dark"] { color-scheme: dark; }
.pane-h { margin: 0 0 var(--space-inset-sm); font-family: var(--type-overline-font-family); font-size: var(--type-overline-font-size); font-weight: var(--type-overline-font-weight); letter-spacing: var(--type-overline-letter-spacing); text-transform: uppercase; color: var(--color-on-surface-variant); }
.scroll-x { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; }
table.m th, table.m td { padding: var(--space-inset) var(--space-inset-md) var(--space-inset) 0; text-align: left; vertical-align: middle; }
table.m thead th { padding-top: 0; font-family: var(--type-label-sm-font-family); font-size: var(--type-label-sm-font-size); font-weight: var(--type-label-sm-font-weight); color: var(--color-on-surface-variant); white-space: nowrap; }
table.m tbody th { font-family: var(--type-label-font-family); font-size: var(--type-label-font-size); font-weight: var(--type-label-font-weight); white-space: nowrap; padding-right: var(--space-inset-lg); }
table.m tr.new td, table.m tr.new th { padding-bottom: var(--space-inset-sm); }
table.m tr.today td, table.m tr.today th { padding-top: var(--space-inset-sm); padding-bottom: var(--space-inset-md); border-bottom: var(--border-width) solid var(--color-divider); }
table.m tr.today:last-child td, table.m tr.today:last-child th { border-bottom: 0; }
table.m tr.today th, .today-h { font-family: var(--type-caption-font-family) !important; font-size: var(--type-caption-font-size) !important; font-weight: var(--type-caption-font-weight) !important; color: var(--color-on-surface-variant); }
table.t tbody tr + tr th, table.t tbody tr + tr td { border-top: var(--border-width) solid var(--color-divider); }
table.t td.today-c { padding-right: var(--space-inset-lg); }
table.t td + td.today-c { border-left: 0; }
.na { color: var(--color-on-surface-variant); }
table.spec { min-width: 100%; }
table.spec th, table.spec td { text-align: left; padding: var(--space-inset-sm) var(--space-inset-md) var(--space-inset-sm) 0; border-bottom: var(--border-width) solid var(--color-divider); vertical-align: top; }
table.spec thead th { font-family: var(--type-label-sm-font-family); font-size: var(--type-label-sm-font-size); font-weight: var(--type-label-sm-font-weight); color: var(--color-on-surface-variant); }
table.spec tbody th { font-weight: var(--type-label-font-weight); }
table.time td.old-t { color: var(--color-on-surface-variant); }
table.time { max-width: 52rem; }

/* ---------- Theme section ---------- */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: var(--space-gap-related); }
.sw { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 0 var(--space-gap-related); padding: var(--space-inset); border-radius: var(--radius-control); box-shadow: inset 0 0 0 1px var(--color-divider); }
.sw-aa { font-family: var(--type-title-font-family); font-size: var(--type-title-font-size); font-weight: 700; }
.sw-r { font-family: var(--type-label-sm-font-family); font-size: var(--type-label-sm-font-size); font-weight: 700; }
.sw-use { grid-column: 1 / -1; font-size: var(--type-caption-font-size); line-height: var(--type-caption-line-height); }
.lines { display: flex; flex-wrap: wrap; gap: var(--space-gap-related) var(--space-gap-group); margin-top: var(--space-gap-group); padding: var(--space-inset); border-radius: var(--radius-control); background: var(--color-surface-raised); }
.ln { display: inline-flex; align-items: center; gap: var(--space-gap-related); font-size: var(--type-caption-font-size); }
.ln-mark { width: 24px; height: 16px; border-radius: var(--radius-inner); border: var(--border-width-strong) solid; }
.ln-r { font-weight: 700; }
.tt-wrap { display: grid; gap: var(--space-gap-section); }
@container screen (width >= 1200px) { .tt-wrap { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } }
.types { display: grid; gap: var(--space-inset-sm); }
.ty { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--space-inset-xs) var(--space-gap-group); padding-bottom: var(--space-inset-sm); border-bottom: var(--border-width) solid var(--color-divider); }
.ty > :first-child { max-width: 36rem; }
.ty-m { font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); white-space: nowrap; }
.scales { display: grid; gap: var(--space-gap-group); align-content: start; }
.spcs { display: grid; gap: var(--space-inset-xs); }
.spc { display: flex; align-items: center; gap: var(--space-gap-related); font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); }
.spc-bar { height: 8px; border-radius: var(--radius-inner); background: var(--color-primary); }
.rads, .elvs { display: flex; flex-wrap: wrap; gap: var(--space-gap-group); }
.rad { display: grid; justify-items: center; gap: var(--space-inset-xs); font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); }
.rad-box { width: 48px; height: 48px; background: var(--color-primary-container); border: var(--border-width-strong) solid var(--color-primary); }
.elv { width: 96px; height: 64px; display: grid; place-items: center; border-radius: var(--radius-container); background: var(--color-surface-raised); font-size: var(--type-caption-font-size); }

/* ---------- Buttons ---------- */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-inset-sm); min-height: var(--button-height); padding: 0.35em var(--button-padding-x); border-radius: var(--button-radius); font-family: var(--type-label-font-family); font-size: var(--type-label-font-size); font-weight: var(--type-label-font-weight); line-height: var(--type-label-line-height); white-space: nowrap; border: var(--border-width) solid transparent; transition: background-color var(--motion-duration-feedback) var(--motion-easing); user-select: none; }
.btn.primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn.primary:hover, .btn.primary.is-hover { background: var(--color-primary-hover); }
.btn.primary:active, .btn.primary.is-pressed { background: var(--color-primary-pressed); }
.btn.secondary { background: var(--color-surface-raised); color: var(--color-on-surface); border-color: var(--color-outline-variant); }
.btn.secondary:hover, .btn.secondary.is-hover { background: var(--color-surface-hover); }
.btn.secondary:active, .btn.secondary.is-pressed { background: var(--color-surface-pressed); }
.btn.danger { background: var(--color-surface-raised); color: var(--color-on-error-container); border-color: var(--color-error-outline); }
.btn.danger:hover, .btn.danger.is-hover { background: var(--color-error-container); }
.btn.danger:active, .btn.danger.is-pressed { background: var(--color-error-container); border-color: var(--color-error); }
.btn.sm { min-height: var(--button-height-sm); padding: 0.2em var(--button-padding-x-sm); font-size: var(--type-label-sm-font-size); gap: var(--space-inset-xs); }
.icon-btn { display: inline-grid; place-items: center; width: var(--size-control-sm); height: var(--size-control-sm); border-radius: var(--radius-control); color: var(--color-on-surface-variant); transition: background-color var(--motion-duration-feedback) var(--motion-easing); }
.icon-btn:hover, .icon-btn.is-hover { background: var(--color-surface-hover); color: var(--color-on-surface); }
.icon-btn:active, .icon-btn.is-pressed { background: var(--color-surface-pressed); color: var(--color-on-surface); }
.link { color: var(--color-link); font-family: var(--type-label-font-family); font-size: var(--type-label-font-size); font-weight: var(--type-label-font-weight); border-radius: var(--radius-inner); cursor: pointer; text-underline-offset: 2px; }
.link:hover, .link.is-hover { text-decoration: underline; }
.link:active, .link.is-pressed { text-decoration: underline; color: var(--color-on-primary-container); }
.is-disabled, [aria-disabled="true"], button:disabled { opacity: var(--opacity-disabled); cursor: not-allowed; pointer-events: none; }
.is-busy, [aria-busy="true"].btn { cursor: progress; }
.btn.primary.is-busy { background: var(--color-primary); }
.btn > .bl { display: inline-flex; align-items: center; gap: inherit; }
.btn.is-busy > .bl { visibility: hidden; }
.btn.is-busy > .spin { position: absolute; inset: 0; margin: auto; }
.spin { width: max(var(--size-icon), 1em); height: max(var(--size-icon), 1em); border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin var(--motion-duration-spin) linear infinite; flex: none; }

/* ---------- Live demos ---------- */

/* ================= This design ================= */
[data-screen="doc"] { position: relative; background: var(--color-surface); color: var(--color-on-surface); font-family: var(--type-body-font-family); font-size: var(--type-body-font-size); line-height: var(--type-body-line-height); scroll-padding-top: 72px; }
@container screen (width >= 840px) { [data-screen="doc"] { scroll-padding-top: var(--space-inset-lg); } }
[data-screen="app"] { position: relative; overflow: hidden; background: var(--color-surface); }
.code { font-family: var(--type-code-font-family); font-size: var(--type-code-font-size); }
.lede { max-width: 46rem; color: var(--color-on-surface-variant); font-size: var(--type-reading-font-size); line-height: var(--type-reading-line-height); margin: 0; }
.prose { max-width: 46rem; margin: 0; font-size: var(--type-reading-font-size); line-height: var(--type-reading-line-height); }
.eyebrow { font-family: var(--type-overline-font-family); font-size: var(--type-overline-font-size); font-weight: var(--type-overline-font-weight); letter-spacing: var(--type-overline-letter-spacing); text-transform: uppercase; color: var(--color-on-surface-variant); margin: 0; }
.hero { display: grid; gap: var(--space-gap-related); }
.tldr { display: grid; gap: var(--space-inset-sm); max-width: 52rem; padding: var(--space-inset-md); border-radius: var(--radius-container); background: var(--color-surface-container); }
.tldr dl { display: grid; grid-template-columns: 1fr; gap: var(--space-inset-xs) var(--space-gap-group); margin: 0; }
@container screen (width >= 640px) { .tldr dl { grid-template-columns: 11rem 1fr; } }
.tldr dt { font-family: var(--type-label-font-family); font-size: var(--type-label-font-size); font-weight: 700; }
.tldr dd { margin: 0 0 var(--space-inset-xs); }
.h2 { scroll-margin-top: 72px; }

/* compare grids */
.cmp { display: grid; gap: var(--space-gap-group); }
.cmp-h { display: none; }
.cmp-r { display: grid; gap: var(--space-gap-related); }
.cmp-l { font-family: var(--type-label-font-family); font-size: var(--type-label-font-size); font-weight: 700; }
@container screen (width >= 1000px) {
  .cmp-h, .cmp-r { display: grid; grid-template-columns: 7rem minmax(0,1fr) minmax(0,1fr); gap: var(--space-gap-group); align-items: start; }
  .cmp-h > span { font-family: var(--type-label-sm-font-family); font-size: var(--type-label-sm-font-size); font-weight: var(--type-label-sm-font-weight); color: var(--color-on-surface-variant); }
  .cmp-r .fig-c { display: none; }
}
.fig { margin: 0; display: grid; gap: var(--space-inset-xs); min-width: 0; }
.fig-c { font-size: var(--type-caption-font-size); line-height: var(--type-caption-line-height); color: var(--color-on-surface-variant); }
.shot { display: block; width: 100%; height: auto; border-radius: var(--radius-control); box-shadow: 0 0 0 1px var(--color-divider); }
[data-screen="doc"].is-dark .shot.lt, [data-screen="doc"]:not(.is-dark) .shot.dk { display: none; }
.mini { position: relative; width: 100%; overflow: hidden; border-radius: var(--radius-control); box-shadow: 0 0 0 1px var(--color-divider); background: var(--color-surface); cursor: zoom-in; }
.mini:focus-visible { outline: var(--focus-width) solid var(--color-focus-ring); outline-offset: var(--focus-offset); }
.mini > .win { position: absolute; top: 0; left: 0; transform-origin: 0 0; pointer-events: none; }
.minis { display: grid; gap: var(--space-gap-group); grid-template-columns: minmax(0,1fr); align-items: start; }
@container screen (width >= 1000px) { .minis { grid-template-columns: minmax(0,1.8fr) minmax(0,1fr); } }
.opts { display: grid; gap: var(--space-gap-group); }
.opt { display: grid; gap: var(--space-inset-sm); align-content: start; padding: var(--space-inset-md); border-radius: var(--radius-container); background: var(--color-surface-raised); border: var(--border-width) solid var(--color-divider); }
.opt-h { display: flex; align-items: center; gap: var(--space-inset-sm); flex-wrap: wrap; }

/* menu comparison */
.mcmp { display: grid; gap: var(--space-gap-group); }
@container screen (width >= 1000px) { .mcmp { grid-template-columns: 7rem minmax(0,1fr); } }
.mstrip { display: flex; flex-wrap: wrap; gap: var(--space-gap-group); align-items: flex-start; }
.mcol { display: grid; gap: var(--space-inset-xs); justify-items: start; }
.mcol > .menu, .mcol > .o-menu { position: static; }
.mname { font-family: var(--type-label-font-family); font-size: var(--type-label-font-size); font-weight: 700; }
.mi.dis { opacity: var(--opacity-disabled); }
.mi.new-i { box-shadow: inset 2px 0 0 var(--color-success); }
.o-mi .o-k { margin-left: auto; padding-left: 24px; color: var(--o-muted); font-size: 0.75rem; }
.o-sep { height: 1px; margin: 4px 6px; background: var(--o-border); }
.o-mi.o-dis { opacity: .45; }

/* key tables */
.ktab th[scope="row"] { white-space: nowrap; }
.k { display: inline-flex; align-items: center; min-height: var(--size-tag); padding: 0 var(--space-inset-xs); border-radius: var(--radius-inner); background: var(--color-surface-container); font-family: var(--type-label-sm-font-family); font-size: var(--type-label-sm-font-size); font-weight: 700; white-space: nowrap; }
.was { color: var(--color-on-surface-variant); text-decoration: line-through; }
.risk { display: grid; gap: var(--space-inset-xs); padding: var(--space-inset-md) 0; border-bottom: var(--border-width) solid var(--color-divider); max-width: 52rem; }
.risk:last-child { border-bottom: 0; }
.risk-h { display: flex; align-items: center; gap: var(--space-inset-sm); flex-wrap: wrap; }
.passbar { display: flex; align-items: center; gap: var(--space-gap-related); max-width: 52rem; }
.passbar-t { flex: 1; height: 8px; border-radius: var(--radius-pill); background: var(--color-surface-container); overflow: hidden; }
.passbar-f { height: 100%; background: var(--color-success); }
.checks { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--space-inset-xs); max-width: 52rem; }
.checks li { display: grid; grid-template-columns: 24px 1fr; align-items: start; gap: var(--space-gap-related); }
.checks input { width: 16px; height: 16px; margin: 4px; accent-color: var(--color-primary); }
.checks .cid { font-family: var(--type-code-font-family); font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); }
.tflow { display: grid; gap: var(--space-gap-related); }

/* ================= The app window ================= */
.win { container: win / inline-size; position: relative; display: grid; grid-template-rows: auto minmax(0,1fr); width: 100%; height: 100%; overflow: hidden; background: var(--color-surface); color: var(--color-on-surface); font-family: var(--type-body-font-family); font-size: var(--type-body-font-size); line-height: var(--type-body-line-height); }
/* The menu bar and its menus are drawn by macOS, so they keep the system size when the app's text grows. */
.mbar { display: flex; align-items: center; height: 24px; overflow: hidden; padding: 0 var(--space-inset-sm); background: var(--color-surface-container); border-bottom: var(--border-width) solid var(--color-divider); font-family: var(--type-label-sm-font-family); font-size: 12px; line-height: 16px; }
.win:not([data-bar]) > .mbar { display: none; }
.mb { height: 24px; padding: 0 var(--space-inset-sm); border-radius: var(--radius-inner); white-space: nowrap; }
.mb.app { font-weight: 700; }

    <main class="content">
      <header class="hero part" id="top">
        <p class="eyebrow">Mac app design</p>
        <h1 class="t-headline">Menus, keyboard shortcuts, links and search</h1>
        <p class="lede">The menu bar, the shortcut keys, links from notifications and the search box, drawn as they look once every fix in this part of the review is in. Each drawing sits beside today’s app at the largest and smallest window; click a drawing to try it.</p>
        <div class="tldr">
          <h2 class="t-title">TL;DR</h2>
          <dl>
            <dt>Problem</dt><dd>Menus miss most pages and commands, Backlog skips ⌘4, and search shows two highlights and live-looking terminals that aren’t running.</dd>
            <dt>Fix</dt><dd>Every command lives in the menu bar with its key, pages take ⌘1–⌘7 in sidebar order, and search has one highlight.</dd>
            <dt>What users notice</dt><dd>⌘K finds tasks, goals, ideas, backlog and terminals, and a notification link opens on top of any dialog.</dd>
            <dt>How we know it worked</dt><dd>Every key in the table does what its menu item says, at the smallest and largest window.</dd>
          </dl>
        </div>
      </header>

      <section class="part" id="problem">
        <h2 class="t-title-lg h2">Problem</h2>
        <ul class="rules">
          <li>The menu bar has three menus. View lists five of the six pages, Ideas has no key, and Backlog sits on ⌘5 with nothing on ⌘4.</li>
          <li>There’s no Edit menu, so Copy Reference and Undo can’t be found, and the debugging export sits in File.</li>
          <li>Search highlights the chosen row and the row under the pointer at once, so two rows look picked.</li>
          <li>Search lists terminals as “idle under a minute” while Midna isn’t running, and has no state for a slow or unreachable board.</li>
          <li>A link from a notification opens its task behind an open dialog.</li>
          <li>Asking Midna to show a terminal while it’s not running says “Showing it in Midna”, and nothing happens.</li>
          <li>With releases off on every project, the Releases page has no way in and nothing explains why.</li>
        </ul>
      </section>

      <section class="part" id="solution">
        <h2 class="t-title-lg h2">Solution</h2>
        <ul class="rules">
          <li>One macOS menu bar holds every command, greyed when nothing is open for it to act on, with its key beside it.</li>
          <li>One key table: pages on ⌘1–⌘7 in the order the sidebar lists them, and standard Mac keys left alone.</li>
          <li>Search shows one highlight that follows the pointer and the arrow keys, five rows a group, and a plain line for each failure.</li>
          <li>A link closes an open dialog first, keeping what was typed, then opens its task in the side panel.</li>
          <li>When something can’t happen, the toast says so and stays until it’s closed.</li>
        </ul>
      </section>

      <section class="part" id="menus">
        <h2 class="t-title-lg h2">Menu bar: every page and command, with its key</h2>
        <p class="prose">The app menu gains About, updates, hooks and the daemon restart. Edit is new, so Copy, Copy Reference and Undo have a home. View lists all seven pages. Task and Idea hold the one-click signals for the open task or idea and are greyed when none is open. The export moves to Help.</p>
        <div class="mcmp">
          <span class="cmp-l">Today</span>
          <div class="mstrip today-c" id="menus-old"></div>
          <span class="cmp-l">With fixes</span>
          <div class="mstrip" id="menus-new"></div>
        </div>
        <h3 class="t-title">View menu open, in the window</h3>
        <div class="minis" data-minis="menu" data-bar></div>
      </section>

      <section class="part" id="keys">
        <h2 class="t-title-lg h2">Keyboard shortcuts, settled into one table</h2>
        <p class="prose">Every key here is also shown in its menu and in the tip of the control it presses. While a dialog is open, page keys, Back, Forward and Search pause and their menu items grey out; a link from a notification still opens. ⌃F2 reaches the menu bar from the keyboard, and ← → move across it.</p>
        <div class="scroll-x">
          <table class="spec ktab">
            <thead><tr><th scope="col">Key</th><th scope="col">Does</th><th scope="col">Today</th></tr></thead>
            <tbody id="keyrows"></tbody>
          </table>
        </div>
        <h3 class="t-title">Clashes between the review proposals</h3>
        <div class="scroll-x">
          <table class="spec">
            <thead><tr><th scope="col">Key</th><th scope="col">Asked for</th><th scope="col">Settled</th><th scope="col">Why</th></tr></thead>
            <tbody>
              <tr><th scope="row"><span class="k">⌘4</span></th><td>Ideas (Ideas review) · Backlog (fix plan)</td><td>Backlog ⌘4, Ideas ⌘5</td><td>Keys follow the sidebar from top to bottom, so the number matches the row.</td></tr>
              <tr><th scope="row"><span class="k">⌘[ ⌘]</span></th><td>Back and Forward (Insights review) · today’s ⌘← ⌘→</td><td>Both pairs work</td><td>⌘[ ⌘] are the Mac standard; ⌘← ⌘→ stay so nobody loses a habit. Inside a text field ⌘← ⌘→ move the caret.</td></tr>
              <tr><th scope="row"><span class="k">[ ]</span></th><td>Previous and next week on Days (Insights review) · Back and Forward</td><td>Plain [ ] on Days only</td><td>No ⌘, so they can’t clash with Back. They act only while the Days page has focus, never in a text field.</td></tr>
              <tr><th scope="row"><span class="k">⌘7</span></th><td>Releases (Insights review), greyed with releases off (fix plan)</td><td>Always on</td><td>A greyed key gives no reason. The page opens and says releases are off and how to turn them on.</td></tr>
                          </tbody>
          </table>
        </div>
      </section>

      <section class="part" id="search">
        <h2 class="t-title-lg h2">Search: one highlight, best match first</h2>
        <ul class="rules">
          <li>One highlight. It follows the pointer and the arrow keys; there’s no separate hover look.</li>
          <li>Each row shows its reference, the title with the typed text marked, its status in words, and its goal. When the search is narrower than about 40 characters of text, the goal drops, so at 200% text the title keeps its room.</li>
          <li>Five rows a group, then “Show all”. The list scrolls in one place and draws only the rows in view.</li>
          <li>A match found only in the description or details says so under the title.</li>
          <li>While Midna isn’t running, terminals are one line that says so, instead of rows that repeat the tasks.</li>
          <li>↑ ↓ move, ↩ opens, ⌘↩ opens the pull request, Esc closes.</li>
        </ul>

};
