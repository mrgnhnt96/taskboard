<template id="uh-screen">
<style>
:host { color-scheme: light dark; }

/* ── Theme "Ledger": warm paper, graphite ink, status hues only for status ── */
.win, .sw {
  /* surfaces */
  --surface: light-dark(#f6f4ef, #171615);
  --surface-raised: light-dark(#ffffff, #221f1d);
  --surface-sunken: light-dark(#eeebe4, #121110);
  --surface-side: light-dark(#efece6, #1c1a18);
  --surface-select: light-dark(#e3dfd5, #302d29);
  --surface-hover: light-dark(#ebe7df, #26231f);
  --on-surface: light-dark(#1d1c1a, #ece8e1);
  --on-surface-variant: light-dark(#5f5a51, #a8a296);
  --outline: light-dark(#dcd7cd, #34312d);
  --outline-strong: light-dark(#8c867a, #6f6a61);
  /* ink: the one action colour */
  --primary: light-dark(#1d1c1a, #ece8e1);
  --on-primary: light-dark(#f6f4ef, #171615);
  --focus-ring: light-dark(#1f63a8, #82b8f5);
  /* status roles (always with a glyph or words) */
  --needs: light-dark(#8f5200, #f0b455);
  --needs-tint: light-dark(#fbefd9, #3a2c14);
  --error: light-dark(#b42318, #ff8f85);
  --error-tint: light-dark(#fbe5e2, #3d1c19);
  --on-error: light-dark(#ffffff, #2a0d0a);
  --working: light-dark(#1f63a8, #82b8f5);
  --review: light-dark(#6a46b8, #bca6ff);
  --done: light-dark(#2d7449, #86d3a3);
  --quiet: light-dark(#5f5a51, #a8a296);
  /* type */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --fs-label: 0.75rem;   /* 12 */
  --fs-body: 0.8125rem;  /* 13, macOS body */
  --fs-title: 0.9375rem; /* 15 */
  --fs-head: 1.375rem;   /* 22 */
  /* space (8-pt, 4/12 inside components) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  /* radius */
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  /* elevation: flat, overlay, dialog */
  --shadow-overlay: 0 8px 24px light-dark(rgb(40 30 10 / .14), rgb(0 0 0 / .5)), 0 0 0 1px var(--outline);
  --shadow-dialog: 0 16px 48px light-dark(rgb(40 30 10 / .2), rgb(0 0 0 / .6)), 0 0 0 1px var(--outline);
  --dur: 160ms; --ease: cubic-bezier(.2,.7,.2,1);
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: 1.45;
  color: var(--on-surface);
  background: var(--surface);
  -webkit-font-smoothing: antialiased;
}
@media (prefers-reduced-motion: reduce) { .win, .sw { --dur: 0ms; } }

[data-screen] { height: 100%; overflow: hidden; }
* { box-sizing: border-box; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: var(--r-sm); }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.mono, .ref { font-family: var(--mono); font-size: var(--fs-label); }
.ref { color: var(--on-surface-variant); }
a.ref, button.ref { color: inherit; text-decoration: underline; text-decoration-color: var(--outline-strong); text-underline-offset: 2px; background: none; border: 0; padding: 0; }
.var { color: var(--on-surface-variant); }
.lbl-s { font-size: var(--fs-label); color: var(--on-surface-variant); }
.num { font-variant-numeric: tabular-nums; }

/* ── Window shell ── */
.win {
  --side-w: 232px; --insp-w: 420px;
  position: relative; height: 100%;
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr) auto auto;
  grid-template-rows: 48px minmax(0, 1fr);
  grid-template-areas: "side tb tb tb" "side main div insp";
}
.win.side-off { --side-w: 0px; }
.win.side-off .side { display: none; }

/* toolbar: two groups, history (leading) and find/make (trailing) */
.tb { grid-area: tb; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3); border-bottom: 1px solid var(--outline); background: var(--surface); min-width: 0; }
.tb .grow { flex: 1; }
.tb .grp { display: flex; align-items: center; gap: var(--s1); }
.ib { display: inline-grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: var(--r-md); background: none; color: var(--on-surface-variant); }
.ib:hover { background: var(--surface-hover); color: var(--on-surface); }
.ib[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.ib[aria-pressed="true"] { background: var(--surface-select); color: var(--on-surface); }
.find { display: flex; align-items: center; gap: var(--s2); width: 240px; height: 28px; padding: 0 var(--s2); border: 1px solid var(--outline); border-radius: var(--r-md); background: var(--surface-raised); color: var(--on-surface-variant); text-align: left; }
.find:hover { border-color: var(--outline-strong); }
.find span { flex: 1; }
.kbd { font-family: var(--mono); font-size: var(--fs-label); color: var(--on-surface-variant); }

/* sidebar */
.side { grid-area: side; display: flex; flex-direction: column; min-height: 0; background: var(--surface-side); border-right: 1px solid var(--outline); }
.side-scroll { flex: 1; overflow: auto; padding: var(--s3) var(--s2) var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
.scope { display: flex; align-items: center; gap: var(--s2); width: 100%; height: 32px; padding: 0 var(--s2); border: 0; border-radius: var(--r-md); background: none; font-weight: 600; text-align: left; }
.scope:hover { background: var(--surface-hover); }
.scope .lbl { flex: 1; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a, .gl a { display: flex; align-items: center; gap: var(--s2); min-height: 28px; padding: var(--s1) var(--s2); border-radius: var(--r-md); color: inherit; text-decoration: none; cursor: pointer; }
.nav a:hover, .gl a:hover { background: var(--surface-hover); }
.nav a[aria-current="page"] { background: var(--surface-select); font-weight: 600; }
.nav a .lbl, .gl a .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav a .n { font-size: var(--fs-label); color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
.nav a .n.hot { color: var(--needs); font-weight: 600; }
.side h2 { font-size: var(--fs-label); font-weight: 600; color: var(--on-surface-variant); padding: 0 var(--s2) var(--s1); }
.gl { display: flex; flex-direction: column; gap: 2px; }
.gl a .n { font-size: var(--fs-label); color: var(--on-surface-variant); }
.side-foot { border-top: 1px solid var(--outline); padding: var(--s2); display: flex; flex-direction: column; gap: 2px; }
.sf { display: flex; align-items: center; gap: var(--s2); width: 100%; min-height: 28px; padding: var(--s1) var(--s2); border: 0; border-radius: var(--r-md); background: none; color: var(--on-surface-variant); font-size: var(--fs-label); text-align: left; }
.sf:hover { background: var(--surface-hover); color: var(--on-surface); }
.sf .lbl { flex: 1; min-width: 0; }
.sf.bad { color: var(--error); }
.sf.warn { color: var(--needs); }
.meter { display: inline-block; width: 40px; height: 4px; border-radius: 2px; background: var(--outline); position: relative; overflow: hidden; vertical-align: middle; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--on-surface-variant); border-radius: 2px; }
.meter.warm i { background: var(--needs); }
.meter.hot i { background: var(--error); }

/* main content */
.main { grid-area: main; overflow: auto; position: relative; min-width: 0; scroll-padding-top: 16px; }
.col { max-width: 880px; margin: 0 auto; padding: var(--s5) var(--s6) var(--s7); }
.col.wide { max-width: 1280px; }
.ph { display: flex; align-items: flex-start; gap: var(--s4); margin-bottom: var(--s5); flex-wrap: wrap; }
.ph .t { flex: 1; min-width: 240px; }
.ph h1 { font-size: var(--fs-head); line-height: 1.2; font-weight: 650; letter-spacing: -.01em; }
.ph .sum { margin-top: var(--s1); color: var(--on-surface-variant); }
.ph .acts { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.crumb { display: flex; gap: var(--s1); align-items: center; font-size: var(--fs-label); color: var(--on-surface-variant); margin-bottom: var(--s1); }
.crumb a { color: inherit; text-decoration: none; cursor: pointer; }
.crumb a:hover { text-decoration: underline; }

/* buttons: primary (ink), secondary (outline), plain (text) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 28px; padding: 0 var(--s3); border: 1px solid var(--outline-strong); border-radius: var(--r-md); background: var(--surface-raised); color: var(--on-surface); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-hover); }
.btn.pri { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.pri:hover { background: color-mix(in srgb, var(--primary) 86%, var(--surface)); }
.btn.plain { border-color: transparent; background: none; color: var(--on-surface-variant); }
.btn.plain:hover { background: var(--surface-hover); color: var(--on-surface); }
.btn.danger { background: var(--error); border-color: var(--error); color: var(--on-error); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn.sending { opacity: .7; cursor: progress; }
.btn.sending::after { content: ""; width: 10px; height: 10px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn .kbd { color: inherit; opacity: .7; }

/* segmented control: quiet selected state */
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--r-md); background: var(--surface-sunken); }
.seg button { min-height: 24px; padding: 0 var(--s3); border: 0; border-radius: 6px; background: none; color: var(--on-surface-variant); }
.seg button:hover { color: var(--on-surface); }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--surface-raised); color: var(--on-surface); font-weight: 600; box-shadow: 0 0 0 1px var(--outline); }

/* fields */
.field { display: flex; flex-direction: column; gap: var(--s1); }
.field > span { font-size: var(--fs-label); color: var(--on-surface-variant); font-weight: 500; }
.in, textarea.in, select.in { min-height: 28px; padding: var(--s1) var(--s2); border: 1px solid var(--outline-strong); border-radius: var(--r-md); background: var(--surface-raised); width: 100%; }
textarea.in { min-height: 64px; resize: vertical; line-height: 1.45; }
.check { display: inline-grid; place-items: center; width: 24px; height: 24px; }
.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); }
.switch { appearance: none; width: 32px; height: 20px; border-radius: 10px; background: var(--outline-strong); position: relative; margin: 0; flex: none; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface-raised); transition: left var(--dur) var(--ease); }
.switch:checked { background: var(--primary); }
.switch:checked::after { left: 14px; }

/* status: glyph + words, never a pill */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-label); font-weight: 600; white-space: nowrap; }
.st svg.g { width: 12px; height: 12px; flex: none; }
.c-needs { color: var(--needs); } .c-error { color: var(--error); } .c-working { color: var(--working); }
.c-review { color: var(--review); } .c-done { color: var(--done); } .c-quiet { color: var(--quiet); }

/* sections and rows */
.grp-h { display: flex; align-items: baseline; gap: var(--s2); margin: 0 0 var(--s2); }
.grp-h h2 { font-size: var(--fs-title); font-weight: 650; }
.grp-h .n { color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
.grp-h .grow { flex: 1; }
.grp + .grp { margin-top: var(--s6); }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--outline); }
.row { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; column-gap: var(--s2); align-items: start; padding: var(--s2) var(--s1) var(--s2) 0; border-bottom: 1px solid var(--outline); }
.row:hover { background: color-mix(in srgb, var(--surface-hover) 60%, transparent); }
.row.sel { background: var(--surface-select); }
.row.urgent::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--error); }
.row > .g { display: grid; place-items: center; height: 24px; }
.row .mid { min-width: 0; }
.row .ti { display: flex; gap: var(--s2); align-items: baseline; min-width: 0; }
.row .ti .tt { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
.row .ti .tt:hover { text-decoration: underline; text-decoration-color: var(--outline-strong); }
.row .meta { display: flex; flex-wrap: wrap; gap: 0 var(--s2); font-size: var(--fs-label); color: var(--on-surface-variant); margin-top: 2px; }
.row .meta .sep::before { content: "·"; }
.row .end { display: flex; align-items: center; gap: var(--s1); }
.row .age { font-size: var(--fs-label); color: var(--on-surface-variant); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; margin-right: var(--s2); }
.row .body { grid-column: 2 / -1; padding: var(--s3) 0 var(--s2); display: flex; flex-direction: column; gap: var(--s3); }
.row .kids { grid-column: 2 / -1; margin-top: var(--s2); border-top: 1px solid var(--outline); }
.row .kids .row { padding-left: 0; }
.row .kids .row:last-child { border-bottom: 0; }
.row .x { width: 24px; height: 24px; border: 0; background: none; display: grid; place-items: center; color: var(--on-surface-variant); border-radius: var(--r-sm); }
.row .x:hover { background: var(--surface-hover); }
.row .x svg { transition: transform var(--dur) var(--ease); }
.row[data-open="true"] > .g .x svg { transform: rotate(90deg); }
.more-line { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) 0; }

/* question / answer component */
.q { display: flex; flex-direction: column; gap: var(--s2); }
.q .qt { font-weight: 600; max-width: 68ch; }
.opts { display: flex; flex-direction: column; gap: var(--s1); }
.opt { display: grid; grid-template-columns: 16px 1fr; gap: 2px var(--s2); padding: var(--s2) var(--s3); border: 1px solid var(--outline-strong); border-radius: var(--r-md); background: var(--surface-raised); text-align: left; max-width: 68ch; }
.opt:hover { border-color: var(--on-surface); }
.opt .r { width: 14px; height: 14px; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--outline-strong); }
.opt b { font-weight: 600; }
.opt span:last-child { grid-column: 2; color: var(--on-surface-variant); }
.opt[aria-pressed="true"] { border-color: var(--on-surface); box-shadow: inset 0 0 0 1px var(--on-surface); }
.opt[aria-pressed="true"] .r { border: 4px solid var(--on-surface); }
.opt.sending { opacity: .7; }
.answer { display: flex; gap: var(--s2); align-items: flex-end; max-width: 68ch; }
.answer textarea { min-height: 28px; height: 28px; }
.answer .field { flex: 1; }
.btnrow { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }

/* attention block: the one emphasis in the task panel */
.attn { border-radius: var(--r-lg); padding: var(--s3) var(--s4); background: var(--needs-tint); display: flex; flex-direction: column; gap: var(--s3); }
.attn.bad { background: var(--error-tint); }
.attn h3 { font-size: var(--fs-body); font-weight: 650; display: flex; gap: var(--s2); align-items: center; }
.attn p { max-width: 68ch; }

/* banners */
.banner { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) var(--s6); border-bottom: 1px solid var(--outline); background: var(--needs-tint); }
.banner.bad { background: var(--error-tint); }
.banner .t { flex: 1; min-width: 0; }
.banner b { display: block; }
.banner .btnrow { flex-wrap: nowrap; }

/* stats */
.stats { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s6); margin-bottom: var(--s6); }
.stat b { display: block; font-size: var(--fs-head); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: var(--fs-label); color: var(--on-surface-variant); }

/* inspector */
.divider { grid-area: div; width: 1px; background: var(--outline); position: relative; cursor: col-resize; }
.divider::after { content: ""; position: absolute; inset: 0 -4px; }
.divider:focus-visible { outline-offset: 0; width: 3px; }
.insp { grid-area: insp; width: var(--insp-w); min-width: 360px; max-width: 640px; display: flex; flex-direction: column; min-height: 0; background: var(--surface-raised); }
.win:not(.panel-on) .insp, .win:not(.panel-on) .divider { display: none; }
.insp-h { padding: var(--s3) var(--s4) 0; display: flex; flex-direction: column; gap: var(--s2); border-bottom: 1px solid var(--outline); }
.insp-top { display: flex; align-items: center; gap: var(--s1); }
.insp-top .grow { flex: 1; }
.insp h2 { font-size: var(--fs-title); font-weight: 650; line-height: 1.3; }
.insp .meta { font-size: var(--fs-label); color: var(--on-surface-variant); display: flex; flex-wrap: wrap; gap: 0 var(--s2); }
.insp .meta a { color: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--outline-strong); text-underline-offset: 2px; }
.files { display: flex; flex-wrap: wrap; gap: var(--s1); }
.file { display: inline-flex; align-items: center; gap: var(--s1); min-height: 24px; padding: 0 var(--s2); border-radius: var(--r-sm); border: 0; background: var(--surface-sunken); font-size: var(--fs-label); color: var(--on-surface); }
.file:hover { background: var(--surface-select); }
.tabs { display: flex; gap: var(--s4); margin-top: var(--s1); }
.tabs button { min-height: 32px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--on-surface-variant); }
.tabs button[aria-selected="true"] { color: var(--on-surface); border-bottom-color: var(--on-surface); font-weight: 600; }
.tabs .n { font-size: var(--fs-label); color: var(--on-surface-variant); margin-left: 2px; font-weight: 400; }
.insp-b { flex: 1; overflow: auto; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s5); }

/* timeline */
.tl { display: flex; flex-direction: column; }
.ev { display: grid; grid-template-columns: 84px 16px minmax(0, 1fr); column-gap: var(--s2); padding-bottom: var(--s4); position: relative; }
.ev::before { content: ""; position: absolute; left: 99px; top: 16px; bottom: 0; width: 1px; background: var(--outline); }
.ev:last-child::before { display: none; }
.ev time { font-size: var(--fs-label); color: var(--on-surface-variant); text-align: right; padding-top: 1px; font-variant-numeric: tabular-nums; }
.ev .dot { width: 9px; height: 9px; margin: 5px auto 0; border-radius: 50%; background: var(--outline-strong); position: relative; z-index: 1; box-shadow: 0 0 0 3px var(--surface-raised); }
.ev .dot.now { background: var(--working); }
.ev .w { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
.ev .w > b { font-weight: 600; }
.ev details summary { cursor: pointer; color: var(--on-surface-variant); font-size: var(--fs-label); }
.checks { display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-label); }
.checks li { display: flex; gap: var(--s2); align-items: flex-start; }
.checks li > svg { margin-top: 2px; flex: none; }
.pipe { display: flex; flex-direction: column; gap: 0; margin-top: var(--s1); border: 1px solid var(--outline); border-radius: var(--r-md); }
.pipe li { display: grid; grid-template-columns: 16px 1fr auto; gap: var(--s2); align-items: center; padding: 6px var(--s3); border-bottom: 1px solid var(--outline); font-size: var(--fs-label); }
.pipe li:last-child { border-bottom: 0; }
.pipe li.cur { font-weight: 600; }
.pipe li .var { font-weight: 400; }

/* formatted text */
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: var(--s2); }
.prose h4 { font-size: var(--fs-body); font-weight: 650; margin-top: var(--s2); }
.prose ul { list-style: disc; padding-left: 20px; }
.prose ol { list-style: decimal; padding-left: 20px; }
.prose code { font-family: var(--mono); font-size: .92em; background: var(--surface-sunken); padding: 0 3px; border-radius: 3px; }
.prose pre { font-family: var(--mono); font-size: var(--fs-label); background: var(--surface-sunken); padding: var(--s2) var(--s3); border-radius: var(--r-md); white-space: pre-wrap; }

/* log */
.logf { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.log { font-family: var(--mono); font-size: var(--fs-label); display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 72px 72px 1fr; gap: var(--s2); padding: 3px 0; border-bottom: 1px solid var(--outline); }
.log li span:first-child, .log li span:nth-child(2) { color: var(--on-surface-variant); }

/* overlays */
.layer { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.layer > * { pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: light-dark(rgb(40 30 10 / .18), rgb(0 0 0 / .45)); }
.menu { position: absolute; min-width: 200px; max-width: 320px; padding: var(--s1); border-radius: var(--r-md); background: var(--surface-raised); box-shadow: var(--shadow-overlay); display: flex; flex-direction: column; z-index: 30; }
.menu [role=menuitem], .menu [role=menuitemradio] { display: flex; align-items: center; gap: var(--s2); min-height: 28px; padding: 0 var(--s2); border: 0; border-radius: var(--r-sm); background: none; text-align: left; width: 100%; }
.menu [role=menuitem]:hover, .menu [role=menuitem]:focus-visible, .menu [role=menuitemradio]:hover { background: var(--surface-select); outline: none; }
.menu [role=menuitem] .lbl, .menu [role=menuitemradio] .lbl { flex: 1; }
.menu [role=menuitem] .k { font-family: var(--mono); font-size: var(--fs-label); color: var(--on-surface-variant); }
.menu [role=menuitem].danger { color: var(--error); }
.menu [aria-disabled="true"] { opacity: .45; pointer-events: none; }
.menu hr { border: 0; border-top: 1px solid var(--outline); margin: var(--s1) 0; }
.menu h3 { font-size: var(--fs-label); font-weight: 600; color: var(--on-surface-variant); padding: var(--s1) var(--s2) 2px; }
.pop { position: absolute; width: 360px; max-height: calc(100% - 64px); overflow: auto; padding: var(--s4); border-radius: var(--r-lg); background: var(--surface-raised); box-shadow: var(--shadow-overlay); display: flex; flex-direction: column; gap: var(--s4); z-index: 30; }
.pop h3 { font-size: var(--fs-label); font-weight: 600; color: var(--on-surface-variant); }
.pop .it { display: flex; flex-direction: column; gap: var(--s2); }
.dlg { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); width: min(480px, calc(100% - 32px)); max-height: 76%; overflow: auto; padding: var(--s5); border-radius: var(--r-lg); background: var(--surface-raised); box-shadow: var(--shadow-dialog); display: flex; flex-direction: column; gap: var(--s4); }
.dlg h2 { font-size: var(--fs-title); font-weight: 650; }
.dlg .foot { display: flex; justify-content: flex-end; gap: var(--s2); }
.pal { position: absolute; left: 50%; top: 10%; transform: translateX(-50%); width: min(600px, calc(100% - 32px)); max-height: 70%; display: flex; flex-direction: column; border-radius: var(--r-lg); background: var(--surface-raised); box-shadow: var(--shadow-dialog); overflow: hidden; }
.pal-in { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--outline); }
.pal-in input { flex: 1; border: 0; background: none; font-size: var(--fs-title); outline: none; min-height: 28px; }
.pal-in .chip { display: inline-flex; align-items: center; gap: var(--s1); padding: 2px var(--s2); border-radius: var(--r-sm); background: var(--surface-sunken); font-size: var(--fs-label); white-space: nowrap; }
.pal-r { overflow: auto; padding: var(--s2); }
.pal-r h3 { font-size: var(--fs-label); color: var(--on-surface-variant); font-weight: 600; padding: var(--s2) var(--s2) var(--s1); }
.pal-r [role=option] { display: grid; grid-template-columns: 20px 56px 1fr auto; gap: var(--s2); align-items: center; min-height: 32px; padding: 0 var(--s2); border-radius: var(--r-md); cursor: pointer; }
.pal-r [role=option][aria-selected="true"] { background: var(--surface-select); }
.pal-r [role=option] .st { font-weight: 500; }
.pal-f { display: flex; gap: var(--s4); padding: var(--s2) var(--s4); border-top: 1px solid var(--outline); font-size: var(--fs-label); color: var(--on-surface-variant); }
.toasts { position: absolute; left: 50%; bottom: var(--s5); transform: translateX(-50%); display: flex; flex-direction: column; gap: var(--s2); z-index: 40; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: var(--s3); min-height: 40px; padding: var(--s2) var(--s2) var(--s2) var(--s4); border-radius: var(--r-md); background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-overlay); white-space: nowrap; }
.toast.err { background: var(--error); color: var(--on-error); }
.toast button { border: 0; background: none; color: inherit; font-weight: 650; text-decoration: underline; min-height: 24px; padding: 0 var(--s2); }

/* tables-ish lists */
.kv { display: grid; grid-template-columns: max-content 1fr; gap: var(--s1) var(--s4); }
.kv dt { color: var(--on-surface-variant); }
.card { border: 1px solid var(--outline); border-radius: var(--r-lg); padding: var(--s4); background: var(--surface-raised); display: flex; flex-direction: column; gap: var(--s3); }
.card h3 { font-size: var(--fs-body); font-weight: 650; }
.bar { height: 6px; border-radius: 3px; background: var(--outline); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--on-surface-variant); border-radius: 3px; }
.prog { display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-label); color: var(--on-surface-variant); }
.prog .bar { width: 64px; height: 4px; }
.prog .bar i { background: var(--on-surface); }

/* skeleton */
.sk { height: 44px; border-bottom: 1px solid var(--outline); display: flex; align-items: center; gap: var(--s3); }
.sk i { display: block; height: 10px; border-radius: 5px; background: var(--surface-sunken); animation: pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .sk i { animation: none; } }
.empty { padding: var(--s7) 0; display: flex; flex-direction: column; align-items: center; gap: var(--s2); text-align: center; }
.empty b { font-size: var(--fs-title); }

/* goal page */
.band { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r-lg); background: var(--error-tint); margin-bottom: var(--s5); flex-wrap: wrap; }
.band.n { background: var(--needs-tint); }
.band.q { background: var(--surface-sunken); }
.band .t { flex: 1; min-width: 240px; }
.wave { margin-top: var(--s5); }
.wave-h { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s2); flex-wrap: wrap; }
.wave-h h3 { font-size: var(--fs-body); font-weight: 650; }
.stop { display: flex; align-items: center; gap: var(--s2); margin: var(--s4) 0 0; padding: var(--s2) var(--s3); border: 1px dashed var(--outline-strong); border-radius: var(--r-md); font-size: var(--fs-label); color: var(--on-surface-variant); }
.stop.on { border-style: solid; border-color: var(--needs); color: var(--on-surface); background: var(--needs-tint); }
.stop .grow { flex: 1; }
.two { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s6); }

/* days */
.daynav { display: flex; align-items: center; gap: var(--s2); }
.daynav b { font-size: var(--fs-title); min-width: 160px; text-align: center; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--s2); align-items: end; height: 120px; }
.week button { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; gap: var(--s1); height: 100%; border: 0; background: none; padding: 0; color: var(--on-surface-variant); font-size: var(--fs-label); border-radius: var(--r-sm); }
.week button i { display: block; background: var(--outline-strong); border-radius: 3px 3px 0 0; }
.week button[aria-current="date"] i { background: var(--on-surface); }
.week button[aria-current="date"] { color: var(--on-surface); font-weight: 600; }
.lanes { position: relative; display: grid; grid-template-columns: 200px 1fr; font-size: var(--fs-label); }
.lanes .axis { display: grid; grid-template-columns: repeat(10, 1fr); color: var(--on-surface-variant); border-bottom: 1px solid var(--outline); padding-bottom: var(--s1); }
.lanes .ln { display: contents; }
.lanes .nm { padding: 6px var(--s2) 6px 0; border-bottom: 1px solid var(--outline); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; cursor: pointer; }
.lanes .track { position: relative; border-bottom: 1px solid var(--outline); height: 30px; background-image: repeating-linear-gradient(90deg, var(--outline) 0 1px, transparent 1px 10%); }
.lanes .seg-b { position: absolute; top: 9px; height: 12px; border-radius: 3px; }
.seg-b.w { background: var(--working); } .seg-b.n { background: var(--needs); } .seg-b.r { background: var(--review); } .seg-b.q { background: var(--outline-strong); }
.lanes .mk { position: absolute; top: 5px; width: 2px; height: 20px; background: var(--on-surface); }
.lanes .nowl { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--error); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s4); font-size: var(--fs-label); color: var(--on-surface-variant); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 8px; border-radius: 2px; display: inline-block; }
.hbars { display: flex; flex-direction: column; gap: var(--s2); }
.hbars li { display: grid; grid-template-columns: 180px 1fr 64px; gap: var(--s3); align-items: center; font-size: var(--fs-label); }
.hbars .bar i { background: var(--on-surface-variant); }

/* recap */
.hero { padding: var(--s6) 0 var(--s5); }
.hero b { display: block; font-size: 2rem; line-height: 1.15; font-weight: 650; letter-spacing: -.02em; max-width: 24ch; }

/* settings window */
.sw { height: 100%; display: grid; grid-template-columns: 200px minmax(0, 1fr); }
.sw-side { background: var(--surface-side); border-right: 1px solid var(--outline); padding: var(--s3) var(--s2); display: flex; flex-direction: column; gap: 2px; overflow: auto; }
.sw-side h1 { font-size: var(--fs-title); font-weight: 650; padding: var(--s1) var(--s2) var(--s3); }
.sw-main { overflow: auto; }
.sw-col { max-width: 640px; padding: var(--s5) var(--s6) var(--s7); display: flex; flex-direction: column; gap: var(--s5); }
.sw-col h2 { font-size: var(--fs-head); font-weight: 650; }
.setrow { display: flex; align-items: flex-start; gap: var(--s4); padding: var(--s3) 0; border-bottom: 1px solid var(--outline); }
.setrow .t { flex: 1; min-width: 0; }
.setrow .t b { font-weight: 600; display: block; }
.setrow .t span { color: var(--on-surface-variant); font-size: var(--fs-label); }
.setrow > select.in { width: auto; flex: none; }
.setrow .time select.in { width: auto; }
.acct { display: grid; grid-template-columns: 32px 1fr auto; gap: var(--s3); align-items: center; padding: var(--s3) 0; border-bottom: 1px solid var(--outline); }
.acct .av { width: 32px; height: 32px; border-radius: var(--r-md); background: var(--surface-sunken); display: grid; place-items: center; font-weight: 700; font-size: var(--fs-label); }
.code { font-family: var(--mono); font-size: var(--fs-head); letter-spacing: .1em; font-weight: 600; }
.daypick { display: flex; flex-wrap: wrap; gap: var(--s1); }
.daypick button { min-width: 32px; min-height: 28px; padding: 0 var(--s1); border: 1px solid var(--outline-strong); border-radius: var(--r-md); background: var(--surface-raised); font-size: var(--fs-label); }
.daypick button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.time { display: flex; gap: var(--s1); align-items: center; }
.time .in { width: 72px; }

/* ── size classes ── */
@container screen (width < 1200px) {
  .win { --side-w: 56px; --insp-w: 380px; }
  .side .lbl, .side h2, .side .gl, .side .n, .side .chev { display: none; }
  .side-scroll { padding: var(--s3) var(--s2); align-items: center; }
  .nav a, .sf, .scope { justify-content: center; padding: 0; width: 40px; min-height: 36px; position: relative; }
  .nav a .dotn { display: block; }
  .side-foot { align-items: center; }
  .col { padding: var(--s5) var(--s5) var(--s7); }
  .banner { padding: var(--s3) var(--s5); }
  .find { width: 28px; padding: 0; justify-content: center; border-color: transparent; background: none; }
  .find span, .find .kbd { display: none; }
}
.nav a .dotn { display: none; position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--needs); color: var(--surface); font-size: 0.625rem; font-weight: 700; line-height: 16px; text-align: center; }
@container screen (width < 1100px) {
  .insp { grid-area: auto; position: absolute; top: 48px; right: 0; bottom: 0; width: min(var(--insp-w), calc(100% - 56px)); min-width: 0; box-shadow: var(--shadow-dialog); z-index: 15; }
  .divider { display: none !important; }
}
@container screen (width < 960px) {
  .row .age { min-width: 0; }
  .lanes { grid-template-columns: 140px 1fr; }
  .hbars li { grid-template-columns: 120px 1fr 56px; }
}
@container screen (width < 840px) {
  .col { padding: var(--s4) var(--s4) var(--s7); }
  .banner { padding: var(--s3) var(--s4); flex-wrap: wrap; }
  .sw { grid-template-columns: 56px minmax(0, 1fr); }
  .sw-side .lbl, .sw-side h1 { display: none; }
  .sw-side .nav a { justify-content: center; padding: 0; }
  .sw-col { padding: var(--s4); }
  .row .end .btn.main { padding: 0 var(--s2); }
}
@container screen (width >= 1400px) {
  .two { grid-template-columns: minmax(0, 1fr) 300px; }
}

/* ── Backlog ── */
.bl-tools { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-bottom: var(--s4); }
.bl-tools .grow { flex: 1; }
.bl-findw { display: flex; align-items: center; gap: var(--s2); width: 220px; min-height: 28px; padding: 0 var(--s2); border: 1px solid var(--outline-strong); border-radius: var(--r-md); background: var(--surface-raised); color: var(--on-surface-variant); }
.bl-findw .in { border: 0; padding: 0; min-height: 26px; background: none; color: var(--on-surface); }
.bl-findw .in:focus-visible { outline: none; }
.bl-findw:focus-within { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.bl-grp .grp-h { align-items: center; }
.row.bl { grid-template-columns: 24px minmax(0, 1fr) auto; }
.row.bl.picked { background: color-mix(in srgb, var(--surface-select) 70%, transparent); }
.row.bl .g { height: 24px; }
.fold svg { transition: transform var(--dur) var(--ease); }
.fold[aria-expanded="false"] svg { transform: rotate(-90deg); }
.bulk { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; padding: var(--s2) var(--s3); margin: 0 0 var(--s4); border-radius: var(--r-md); background: var(--surface-raised); box-shadow: var(--shadow-overlay); }
.bulk b { margin-right: var(--s2); }
.bulk .grow { flex: 1; }

/* ── Tables ── */
.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-label); }
.tbl th { position: sticky; top: 0; text-align: left; font-weight: 600; color: var(--on-surface-variant); padding: var(--s1) var(--s2) var(--s1) 0; border-bottom: 1px solid var(--outline-strong); background: var(--surface); }
.tbl td { padding: 6px var(--s2) 6px 0; border-bottom: 1px solid var(--outline); font-variant-numeric: tabular-nums; vertical-align: top; }
h3.sub { font-size: var(--fs-label); font-weight: 600; color: var(--on-surface-variant); margin: 0 0 var(--s2); }
* + h3.sub { margin-top: var(--s4); }

/* ── Goals and waves ── */
.wv-h { padding: var(--s3) 0 var(--s1); border-bottom: 1px solid var(--outline); }
.pr-cell { min-width: 44px; text-align: right; font-family: var(--mono); }

/* ── Ideas ── */
.qsteps { display: flex; gap: var(--s4); border-bottom: 1px solid var(--outline); margin-bottom: var(--s1); }
.qsteps button { min-height: 28px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--on-surface-variant); }
.qsteps button[aria-selected="true"] { color: var(--on-surface); border-bottom-color: var(--on-surface); font-weight: 600; }
.score { display: grid; grid-template-columns: max-content 1fr; border: 1px solid var(--outline); border-radius: var(--r-md); }
.score [role=row] { display: contents; }
.score [role=rowheader], .score [role=cell] { padding: 6px var(--s3); border-bottom: 1px solid var(--outline); }
.score [role=row]:last-child > * { border-bottom: 0; }
.score [role=rowheader] { color: var(--on-surface-variant); }

/* ── Settings window ── */
.sw-back { display: inline-flex; align-items: center; gap: var(--s1); min-height: 28px; padding: 0 var(--s2); border-radius: var(--r-md); color: var(--on-surface-variant); cursor: pointer; text-decoration: none; font-size: var(--fs-label); }
.sw-back:hover { background: var(--surface-hover); color: var(--on-surface); }

/* ── Fields and overlays ── */
.err { display: flex; gap: var(--s1); align-items: center; font-style: normal; font-size: var(--fs-label); color: var(--error); }
.err svg { width: 12px; height: 12px; }
.in[aria-invalid="true"] { border-color: var(--error); box-shadow: inset 0 0 0 1px var(--error); }
.menu [role=menuitemcheckbox] { display: flex; align-items: center; gap: var(--s2); min-height: 28px; padding: 0 var(--s2); border: 0; border-radius: var(--r-sm); background: none; text-align: left; width: 100%; }
.menu [role=menuitemcheckbox]:hover, .menu [role=menuitemcheckbox]:focus-visible, .menu [role=menuitemradio]:focus-visible { background: var(--surface-select); outline: none; }
.menu [role=menuitem][aria-disabled="true"] { opacity: .45; cursor: default; }
.menu [role=menuitem].danger { color: var(--error); }
.menu h3 { font-size: var(--fs-label); font-weight: 600; color: var(--on-surface-variant); padding: var(--s1) var(--s2); }
.menu hr { border: 0; border-top: 1px solid var(--outline); margin: var(--s1) 0; }
.skips { display: flex; flex-direction: column; gap: var(--s1); padding: var(--s2) var(--s3); border-radius: var(--r-md); background: var(--surface-sunken); }
.dlg-scroll { max-height: 320px; overflow: auto; }

/* ── Task panel ── */
.bk { min-height: 24px; padding: 0 var(--s2) 0 var(--s1); font-family: var(--mono); font-size: var(--fs-label); }
.kind { display: inline-flex; align-items: center; min-height: 20px; padding: 0 var(--s2); border-radius: var(--r-sm); background: var(--surface-sunken); font-size: var(--fs-label); color: var(--on-surface-variant); }
.kind.bad { background: var(--error-tint); color: var(--error); font-weight: 600; }
.lnk { border: 0; padding: 0; background: none; color: inherit; text-decoration: underline; text-decoration-color: var(--outline-strong); text-underline-offset: 2px; min-height: 24px; }
.psec { display: flex; flex-direction: column; gap: var(--s3); }
.pr-h { display: flex; flex-direction: column; gap: 2px; }
.pr-h h3.sub { color: var(--on-surface); font-size: var(--fs-body); margin: 0; }
.attn .lines pre { margin-top: var(--s2); font-size: var(--fs-label); background: var(--surface-raised); padding: var(--s2) var(--s3); border-radius: var(--r-md); white-space: pre-wrap; }
.attn .lines summary { cursor: pointer; font-size: var(--fs-label); color: var(--on-surface-variant); }
.attn .steps { gap: var(--s1); }
.attn .answer { display: flex; gap: var(--s2); align-items: flex-end; }
.attn .answer .field { flex: 1; }
.startat { display: flex; gap: var(--s2); align-items: flex-end; }
.startat .field { flex: 1; max-width: 240px; }
.note-pv { display: flex; flex-direction: column; gap: var(--s1); padding: var(--s3); border-radius: var(--r-md); background: var(--surface-sunken); }
.note-pv p { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.path { display: flex; flex-wrap: wrap; gap: var(--s1) 0; font-size: var(--fs-label); color: var(--on-surface-variant); }
.path li + li::before { content: "→"; margin: 0 var(--s2); }
.stale-f { display: inline-flex; gap: var(--s1); align-items: center; font-size: var(--fs-label); color: var(--needs); }
.stale-f svg { width: 12px; height: 12px; }
.code-b { position: relative; }
.code-b pre { padding-right: 40px; }
.code-b .ib { position: absolute; top: 2px; right: 2px; }
.ho { display: flex; flex-direction: column; }
.ho ul.prose { margin-bottom: var(--s2); }
.ho details { margin-top: var(--s4); }
.ho details summary { cursor: pointer; color: var(--on-surface-variant); font-size: var(--fs-label); }
.ho-pre { margin-top: var(--s2); background: var(--surface-sunken); padding: var(--s2) var(--s3); border-radius: var(--r-md); white-space: pre-wrap; }
.log li.more-line { border-bottom: 0; padding-top: var(--s2); }
.logf .btn.on { background: var(--surface-select); color: var(--on-surface); font-weight: 600; }
.insp blockquote { margin: var(--s2) 0 0; padding-left: var(--s3); border-left: 2px solid var(--outline-strong); color: var(--on-surface); }
q { quotes: "“" "”"; }
.choices { display: flex; flex-direction: column; gap: var(--s2); }
.choices li { display: grid; grid-template-columns: 148px 1fr; gap: var(--s3); align-items: center; }
.choices .btn { justify-content: flex-start; }
.tri .btnrow { gap: var(--s2); }
.att { display: flex; flex-direction: column; gap: var(--s2); }
.att li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto; gap: var(--s2); align-items: start; }
.att li div { display: flex; flex-direction: column; min-width: 0; }
.pop.wide { width: 400px; }
.todo .field { margin-top: var(--s1); }
.insp .kv dd { min-width: 0; overflow-wrap: anywhere; }

@container screen (width < 840px) {
  .sec { display: none; }
  .bl-findw { width: 100%; }
  .choices li { grid-template-columns: 1fr; gap: var(--s1); }
}
.tbl.fixed { table-layout: fixed; }

/* ── Projects ── */
.pj { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--s6); align-items: start; }
.pj-list { position: sticky; top: 0; display: flex; flex-direction: column; gap: var(--s2); }

function placeOverlays(sec) {
  const winEl = sec.querySelector('.win, .sw'); if (!winEl) return;
  const wr = winEl.getBoundingClientRect(); const scale = wr.width / winEl.offsetWidth || 1;
  const place = (el, anchorSel, how) => {
    const a = anchorSel && sec.querySelector(anchorSel);
    if (!el) return;
    let x, y;
    if (S.menu && S.menu.at && el.classList.contains('menu')) { x = S.menu.at[0]; y = S.menu.at[1]; }
    else if (a) {
      const r = a.getBoundingClientRect();
      x = (r.left - wr.left) / scale; y = (r.bottom - wr.top) / scale + 4;
      if (how === 'right') { x = (r.right - wr.left) / scale + 8; y = (r.top - wr.top) / scale; }
      if (how === 'end') x = (r.right - wr.left) / scale - el.offsetWidth;
    } else return;
    const W = winEl.offsetWidth, H = winEl.offsetHeight;
    if (x + el.offsetWidth > W - 8) x = Math.max(8, W - 8 - el.offsetWidth);
    if (y + el.offsetHeight > H - 8) {
      const up = a ? (a.getBoundingClientRect().top - wr.top) / scale - el.offsetHeight - 4 : H - 8 - el.offsetHeight;
      y = Math.max(8, how === 'right' ? H - 8 - el.offsetHeight : up);
    }
    el.style.left = x + 'px'; el.style.top = y + 'px';
  };
  const m = sec.querySelector('.layer .menu');
  if (m && S.menu) {
    const anchor = S.menu.anchor ? `[data-act="menu"][data-arg="${S.menu.anchor}"]` : null;
    place(m, anchor, S.menu.anchor && S.menu.anchor.startsWith('row:') || (S.menu.anchor || '').startsWith('later:') || (S.menu.anchor || '').startsWith('task-more') || (S.menu.anchor || '').startsWith('goal-more') ? 'end' : '');
    const first = m.querySelector('[role^=menuitem]:not([aria-disabled="true"])'); if (first) first.focus();
  }
  const p = sec.querySelector('.layer .pop');
  if (p) { const id = S.overlay.slice(4); place(p, `[data-act="pop"][data-arg="${id}"]`, 'right'); const f = p.querySelector('button, a'); if (f && !S.keepFocus) f.focus(); }
  const pal = sec.querySelector('.pal-in input'); if (pal) pal.focus();

}

let toastTimer = null;
function toast(text, opts = {}) {

// ── Actions ──
function setup(canvas) {
  C = canvas;
  canvas.onNavigate(({ screen, depth }) => {
    let ctx;
    if (S.next) { ctx = Object.assign(defaults(screen), S.next); S.next = null; }
    else if (hist[depth] && hist[depth].screen === screen && hist[depth].ctx) ctx = Object.assign({}, hist[depth].ctx);
    else ctx = defaults(screen);
    if (depth < S.depth && hist[S.depth] && S.fwdPush) S.fwd.push({ screen: hist[S.depth].screen, ctx: hist[S.depth].ctx });
    S.fwdPush = false;
    hist.length = depth + 1; hist[depth] = { screen, ctx: null };
    S.screen = screen; S.depth = depth; S.overlay = null; S.dlg = null; S.menu = null;
    applyCtx(ctx);
    render();
    if (!S.focusNext) { const m = C.root.querySelector(`[data-screen="${screen}"] .main, [data-screen="${screen}"] .sw-main`); }
  });
  canvas.onState(() => render());
  canvas.onResize(() => { if (S.menu || S.overlay) placeOverlays(C.root.querySelector(`[data-screen="${S.screen}"]`)); });

  const first = canvas.screen || 'needs';
  S.screen = first; hist[0] = { screen: first, ctx: null };
  applyCtx(defaults(first));
  render();

  canvas.root.addEventListener('click', onClick);
  canvas.root.addEventListener('submit', onSubmit);
  canvas.root.addEventListener('keydown', onKey);
  canvas.root.addEventListener('contextmenu', onContext);
  canvas.root.addEventListener('pointerdown', onDividerDown);
  document.addEventListener('keydown', (e) => { if (e.target === document.body && (e.metaKey || e.ctrlKey)) onKey(e); });
}

function onSubmit(e) {
  e.preventDefault();
  const f = e.target;
  if (f.dataset.form === 'idea') submitIdea(f);
}
function submitIdea(f) {
  const title = f.title.value.trim(), project = f.project.value, detail = f.detail.value;
  S.ideaDraft = { title, project, detail };
  const errs = {}; if (!title) errs.title = 1; if (!project) errs.project = 1;
  if (errs.title || errs.project) { S.errors = errs; render(); const bad = C.root.querySelector('[aria-invalid="true"]'); if (bad) bad.focus(); return; }
  S.errors = null; S.sending = 'idea'; render();
  setTimeout(() => { S.sending = null; S.dlg = null; S.ideaDraft = null; toast('Kept I10'); render(); }, 700);
}

function closeAll() { S.menu = null; S.overlay = null; S.dlg = null; }

function onClick(e) {
  const t = e.target.closest('[data-act]');
  if (!t) { if (S.menu && !e.target.closest('.menu')) { S.menu = null; render(); } else if (S.overlay && S.overlay.startsWith('pop:') && !e.target.closest('.pop')) { S.overlay = null; render(); } return; }
  if (t.closest('form') && t.type === 'submit') return;
  const act = t.dataset.act, arg = t.dataset.arg || '';
  if (t.getAttribute('aria-disabled') === 'true') return;
  if (isDown() && t.closest('.main .end, .main .body, .insp-b .attn, .ph .acts') && !['open', 'expand', 'menu', 'go', 'goal', 'idea', 'restart-board'].includes(act)) { toast("The board is offline. Try again when it's back.", { err: true }); render(); return; }
  e.preventDefault();
  const wasMenu = !!S.menu && act !== 'menu';
  if (wasMenu) S.menu = null;
  run(act, arg, t);
}

function run(act, arg, t) {
  switch (act) {
    case 'noop': { const g = t.closest('[role=radiogroup], .seg'); if (g) { g.querySelectorAll('[aria-pressed],[aria-checked]').forEach(b => { b.setAttribute('aria-pressed', b === t); if (b.hasAttribute('aria-checked')) b.setAttribute('aria-checked', b === t); }); } if (t.getAttribute('role') === 'menuitemcheckbox') { t.setAttribute('aria-checked', t.getAttribute('aria-checked') !== 'true'); } return; }
    case 'go': closeAll(); return go(arg, arg === 'week' ? { dayView: 'week', page: 'days' } : undefined);
    case 'goal': closeAll(); return go(arg === 'G3' ? 'goal-stopped' : 'goal', { goal: arg, page: 'goal', panel: null });
    case 'idea': closeAll(); return go('idea', { idea: arg, page: 'idea' });
    case 'settings': closeAll(); return go('settings', { page: 'settings', setSec: arg || 'accounts' });
    case 'back': S.fwdPush = true; return C.back();
    case 'fwd': { const f = S.fwd.pop(); if (f) { S.next = Object.assign({}, f.ctx); const keep = S.fwd; C.navigate(f.screen); S.fwd = keep; } return; }
    case 'side': S.side = !S.side; break;
    case 'panel': S.panel = S.panel ? null : S.lastPanel; if (S.panel) S.focusNext = '.insp-h h2'; break;
    case 'open': closeAll(); if (TASKS[arg] || ISSUES[arg]) { S.panelBack = t && t.closest && t.closest('.insp-b') && S.panel && S.panel !== arg ? S.panel : null; S.panel = arg; S.lastPanel = arg; S.panelTab = 'story'; S.focusNext = '.insp [data-k="insp-title"]'; } else if (GOALS[arg]) return run('goal', arg); break;
    case 'panel-back': { const b = S.panelBack; S.panelBack = null; S.panel = b; S.lastPanel = b; S.panelTab = 'story'; S.focusNext = '.insp [data-k="insp-title"]'; break; }
    case 'close-panel': { S.panelBack = null; const was = S.panel; S.panel = null; S.focusNext = `[data-k="row-${was}"]`; break; }
    case 'tab': S.panelTab = arg; S.focusNext = `.tabs [data-arg="${arg}"]`; break;
    case 'gtab': S.goalTab = arg; S.focusNext = `.tabs [data-arg="${arg}"]`; break;
    case 'dview': S.dayView = arg; S.focusNext = `[data-act="dview"][data-arg="${arg}"]`; break;
    case 'bltab': S.blTab = arg; break;
    case 'setsec': S.setSec = arg; S.flow = null; S.focusNext = `.sw-col h2`; break;
    case 'expand': S.open[arg] = !S.open[arg]; break;
    case 'relproj': S.relProj = arg || null; S.focusNext = 'h1'; break;
    case 'proj': S.proj = arg; S.open['fin-all'] = false; S.focusNext = '.pj-main h2'; break;
    case 'search': S.overlay = 'search'; break;
    case 'close-ov': S.overlay = null; S.focusNext = '.find'; break;
    case 'pop': S.overlay = S.overlay === 'pop:' + arg ? null : 'pop:' + arg; break;
    case 'menu': {
      if (S.menu && S.menu.anchor === arg) { S.menu = null; break; }
      S.menu = { id: arg, anchor: t.closest('.menu') ? (S.menu && S.menu.anchor) : arg, from: arg };
      if (t.closest('.menu')) S.menu.anchor = S.lastAnchor; else S.lastAnchor = arg;
      break;
    }
    case 'dlg': S.menu = null; S.dlg = arg; S.dlgFrom = t && t.dataset ? t.dataset.k || null : null; break;
    case 'newidea': S.menu = null; S.overlay = null; S.dlg = 'newidea'; S.errors = null; break;
    case 'reopen-draft': S.dlg = 'newidea'; S.toast = null; break;
    case 'close-dlg': {
      if (S.dlg === 'newidea') { const f = C.root.querySelector('form[data-form="idea"]'); if (f && (f.title.value || f.detail.value)) { S.ideaDraft = { title: f.title.value, project: f.project.value, detail: f.detail.value }; toast('Idea draft kept', { reopen: true }); } }
      S.dlg = null; S.errors = null; break;
    }
    case 'dlg-done': { S.dlg = null; const [txt, u] = arg.split('|'); toast(txt, { undo: !!u }); if (txt.startsWith('Merged') || txt.startsWith('G9 finished')) { S.gone.add(txt.startsWith('Merged') ? 'T6' : 'B41'); S.lastGone = txt.startsWith('Merged') ? 'T6' : 'B41'; toast(txt, { undo: false }); } break; }
    case 'toast': { const [txt, u] = arg.split('|'); toast(txt, { undo: !!u }); S.lastGone = null; break; }
    case 'gone': { const [ref, txt] = arg.split('|'); S.gone.add(ref); S.lastGone = ref; if (S.panel === ref) S.panel = null; toast(txt, { undo: true }); break; }
    case 'snooze': { const [ref, when] = arg.split('|'); S.snoozed[ref] = when; S.lastGone = ref; if (S.panel === ref) S.panel = null; toast(`${ref} is in Later, ${when}`, { undo: true }); break; }
    case 'unsnooze': delete S.snoozed[arg]; toast(`${arg} is back in Needs you`); break;
    case 'undo': if (S.lastGone) { S.gone.delete(S.lastGone); delete S.snoozed[S.lastGone]; } S.toast = null; S.lastGone = null; break;
    case 'toast-x': S.toast = null; break;
    case 'pickopt': { const [ref, i] = arg.split('|'); S.pick[ref] = +i; break; }
    case 'send': {
      if (S.pick[arg] == null && !(C.root.querySelector(`[data-answer="${arg}"]`) || {}).value) { toast('Pick an answer or type one first.', { err: true }); break; }
      S.sending = arg; render();
      setTimeout(() => { S.sending = null; S.gone.add(arg); S.lastGone = arg; if (S.panel === arg) S.panel = null; toast(`Answer sent to ${arg}`, { undo: true }); render(); }, 600);
      return;
    }
    case 'qstep': { const [ref, n] = arg.split('|'); S.qStep[ref] = +n; break; }
    case 'restart-board': toast('Restarting the board…'); break;
    case 'scope': toast(arg === 'all' ? 'Showing all projects' : `Showing only ${arg}`); break;
    case 'kind': S.kind = arg; break;
    case 'lens': S.lens = arg; break;
    case 'pick': { if (S.picked.has(arg)) S.picked.delete(arg); else S.picked.add(arg); break; }
    case 'pickgrp': { const refs = arg.split(','); const all = refs.every(r => S.picked.has(r)); refs.forEach(r => all ? S.picked.delete(r) : S.picked.add(r)); break; }
    case 'fold': if (S.folded.has(arg)) S.folded.delete(arg); else S.folded.add(arg); break;
    case 'clear': S.picked = new Set(); break;
    case 'bulk': { const n = S.picked.size; toast(arg.replace('3', n), { undo: true }); S.picked = new Set(); break; }
    case 'flow': S.flow = arg || null; break;
    case 'copy': toast(`Copied ${arg}`); break;
  }
  render();
}

function onContext(e) {
  const r = e.target.closest('.row[data-ref], .wave .row');
  if (!r || !r.dataset.ref) return;
  e.preventDefault();
  const sec = C.root.querySelector(`[data-screen="${S.screen}"]`); const winEl = sec.querySelector('.win');
  const wr = winEl.getBoundingClientRect(); const sc = wr.width / winEl.offsetWidth || 1;
  const ref = r.dataset.ref;
  S.menu = { id: GOALS[ref] && !TASKS[ref] ? 'row:' + ref : 'row:' + ref, at: [(e.clientX - wr.left) / sc, (e.clientY - wr.top) / sc], label: 'Actions for ' + ref };
  S.lastAnchor = null;
  render();
}

function onKey(e) {
  const k = e.key, mod = e.metaKey || e.ctrlKey;
  const inField = e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  // menus
  const menu = C.root.querySelector('.layer .menu');
  if (menu && (k === 'ArrowDown' || k === 'ArrowUp' || k === 'Home' || k === 'End')) {
    const items = [...menu.querySelectorAll('[role^=menuitem]:not([aria-disabled="true"])')];
    let i = items.indexOf(C.root.activeElement);
    i = k === 'Home' ? 0 : k === 'End' ? items.length - 1 : (i + (k === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items[i] && items[i].focus(); e.preventDefault(); return;
  }
  if (k === 'Escape') {
    if (S.menu) { const a = S.menu.anchor; S.menu = null; S.focusNext = a ? `[data-act="menu"][data-arg="${a}"]` : null; render(); e.preventDefault(); return; }
    if (S.dlg) { run('close-dlg', ''); e.preventDefault(); return; }
    if (S.overlay) { const o = S.overlay; S.overlay = null; S.focusNext = o === 'search' ? '.find' : `[data-act="pop"][data-arg="${o.slice(4)}"]`; render(); e.preventDefault(); return; }
    if (S.panel) { run('close-panel', ''); e.preventDefault(); return; }
  }
  if (k === 'Tab' && (S.dlg || S.overlay === 'search')) { // trap focus in modal
    const box = C.root.querySelector('.layer .dlg, .layer .pal'); if (box) {
      const f = [...box.querySelectorAll('button, input, textarea, select, [tabindex="0"]')].filter(x => x.offsetParent);
      if (f.length) { const i = f.indexOf(C.root.activeElement); if (e.shiftKey && i <= 0) { f[f.length - 1].focus(); e.preventDefault(); } else if (!e.shiftKey && i === f.length - 1) { f[0].focus(); e.preventDefault(); } }
    }
  }
  if (S.overlay === 'search' && (k === 'ArrowDown' || k === 'ArrowUp' || k === 'Enter')) {
    const opts = [...C.root.querySelectorAll('.pal-r [role=option]')]; let i = opts.findIndex(o => o.getAttribute('aria-selected') === 'true');
    if (k === 'Enter') { const o = opts[i]; if (o) { S.overlay = null; run(o.dataset.act, o.dataset.arg, o); } e.preventDefault(); return; }
    i = (i + (k === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
    opts.forEach((o, j) => o.setAttribute('aria-selected', j === i)); C.root.querySelector('.pal-in input').setAttribute('aria-activedescendant', opts[i].id); opts[i].scrollIntoView({ block: 'nearest' }); e.preventDefault(); return;
  }
  if (mod && k === 'Enter') {
    const f = e.target.closest && e.target.closest('form'); if (f) { e.preventDefault(); f.requestSubmit(); return; }
    const ans = e.target.dataset && e.target.dataset.answer; if (ans) { e.preventDefault(); run('send', ans); return; }
  }
  if (k === 'Enter' && !mod && e.target.dataset && e.target.dataset.answer === undefined && e.target.name === 'title') { e.preventDefault(); e.target.closest('form').requestSubmit(); return; }
  if ((k === 'F10' && e.shiftKey) || k === 'ContextMenu') {
    const r = e.target.closest && e.target.closest('.row[data-ref]');
    if (r) { e.preventDefault(); S.menu = { id: 'row:' + r.dataset.ref, anchor: 'row:' + r.dataset.ref }; S.lastAnchor = S.menu.anchor; render(); }
    return;
  }
  if (mod) {
    const map = { '1': 'needs', '2': 'goals', '3': 'backlog', '4': 'ideas', '5': 'days', '6': 'releases', '7': 'projects' };
    if (map[k]) { e.preventDefault(); return go(map[k]); }
    if (k === 'k') { e.preventDefault(); return run('search'); }
    if (k === 'n') { e.preventDefault(); return run('newidea'); }
    if (k === ',') { e.preventDefault(); return run('settings', ''); }
    if (k === '[') { e.preventDefault(); return run('back'); }
    if (k === ']') { e.preventDefault(); return run('fwd'); }
    if (k === 's' && e.ctrlKey && e.metaKey) { e.preventDefault(); return run('side'); }
    if (k === 'i' && e.altKey) { e.preventDefault(); return run('panel'); }
    if ((k === 'c' || k === 'C') && e.shiftKey && S.panel) { e.preventDefault(); return run('copy', S.panel); }
    if (k === 'f' && S.page === 'backlog') { e.preventDefault(); const f = C.root.querySelector('.bl-find'); if (f) f.focus(); return; }
  }
  if (inField) return;
  // list navigation: ↑↓ move between rows of the main list, ↩ opens
  if ((k === 'ArrowDown' || k === 'ArrowUp') && e.target.closest && e.target.closest('.main') && e.target.classList.contains('tt')) {
    const all = [...C.root.querySelectorAll(`[data-screen="${S.screen}"] .main .tt`)];
    const i = all.indexOf(e.target); const n = all[i + (k === 'ArrowDown' ? 1 : -1)];
    if (n) { n.focus(); e.preventDefault(); }
    return;
  }
  if (S.page === 'backlog' && S.picked.size && !mod) {
    if (k === 'm' || k === 'M') { S.menu = { id: 'bulk-move', anchor: 'bulk-move' }; S.lastAnchor = 'bulk-move'; render(); return; }
    if (k === 'p' || k === 'P') { S.menu = { id: 'bulk-pri', anchor: 'bulk-pri' }; S.lastAnchor = 'bulk-pri'; render(); return; }
    if ('123'.includes(k)) return run('bulk', `Set 3 issues to P${k}`);
    if (k === 'd' || k === 'D') return run('bulk', 'Deferred 3 issues');
    if (k === 'x' || k === 'X') return run('bulk', 'Closed 3 issues as won’t do');
  }
  if (k === ' ' && S.page === 'backlog' && e.target.closest && e.target.closest('.row[data-ref]') && e.target.classList.contains('tt')) { e.preventDefault(); run('pick', e.target.closest('.row').dataset.ref); }
  // divider keyboard resize
  if (e.target.classList && e.target.classList.contains('divider') && (k === 'ArrowLeft' || k === 'ArrowRight')) {
    S.insW = Math.max(360, Math.min(640, (S.insW || 420) + (k === 'ArrowLeft' ? 20 : -20))); S.focusNext = '.divider'; render(); e.preventDefault();
  }
}

function onDividerDown(e) {
  const d = e.target.closest('.divider'); if (!d) return;
  const winEl = d.closest('.win'); const wr = winEl.getBoundingClientRect(); const sc = wr.width / winEl.offsetWidth || 1;
  const insp = winEl.querySelector('.insp');
  const move = (ev) => { const w = Math.max(360, Math.min(640, (wr.right - ev.clientX) / sc)); S.insW = Math.round(w); winEl.style.setProperty('--insp-w', S.insW + 'px'); d.setAttribute('aria-valuenow', S.insW); };
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  e.preventDefault();
}
// ── Pages ──
const sk = (n, w = [42, 26]) => Array.from({ length: n }, (_, i) => `<div class="sk" aria-hidden="true"><i style="width:16px;height:16px;border-radius:50%"></i><i style="width:${w[0] - (i % 3) * 6}%"></i><i style="width:${w[1] - (i % 2) * 8}%;margin-left:auto"></i></div>`).join('');
const loadingCol = (title) => `<div class="col" aria-busy="true"><div class="ph"><div class="t"><h1>${title}</h1><p class="sum">Loading…</p></div></div><ul class="rows">${sk(7)}</ul></div>`;
const grpH = (title, n, extra = '') => `<div class="grp-h"><h2>${title}</h2>${n != null ? `<span class="n">${n}</span>` : ''}<span class="grow"></span>${extra}</div>`;
const tLine = (r) => { const t = TASKS[r]; return t ? t.line : ''; };
const goalOf = (r) => { const t = TASKS[r] || ISSUES[r]; return t && t.goal ? `<a data-act="goal" data-arg="${t.goal}" data-uh-ignore-target>${t.goal} ${GOALS[t.goal].name}</a>` : 'No goal'; };

// ── Needs you ──
function pgNeeds(ds) {
  if (ds === 'loading') return loadingCol('Needs you');
  if (ds === 'empty') return `<div class="col"><div class="ph"><div class="t"><h1>Needs you</h1></div></div>
    <div class="empty">${ic('done', 'i c-done')}<b>Nothing needs you</b><span class="var">4 agents are working. You’ll hear when one needs a hand.</span>
    <div class="btnrow" style="margin-top:8px"><button class="btn" data-act="go" data-arg="goals">See the goals</button><button class="btn plain" data-act="pop" data-arg="hours">Work hours</button></div></div>
    ${laterBlock()}</div>`;
  const q = TASKS.T3;
  const qBody = `<div class="q">
      <span class="lbl-s">T3 asks · question 1 of 2</span>
      <p class="qt"><q>Should removing the last passkey require a password re-check?</q></p>
      ${optsHtml('T3')}
      ${answerHtml('T3')}
    </div>`;
  const rows = [];
  const grp = (title, items) => { const on = items.filter(Boolean); if (!on.length) return ''; return `<section class="grp" aria-label="${title}">${grpH(title, on.length)}<ul class="rows">${on.join('')}</ul></section>`; };
  const waiting = [
    live('T5') && row({ ref: 'T5', g: 'quiet', title: 'Profile the token refresh path', meta: ['No update for 40 minutes', 'G2 Faster sign-in'], age: '40m', main: ['Focus', 'toast', 'Focused T5’s terminal in Midna'], sec: ['Dismiss', 'gone', 'T5|Dismissed the alert for T5'] })
  ];
  const decide = [
    live('T3') && row({ ref: 'T3', g: 'needs', title: q.title, meta: ['Asks which re-check to use', 'G1 Sign-in with passkeys'], age: '9m', body: S.panel === 'T3' ? null : qBody }),
    live('T6') && row({ ref: 'T6', g: 'review', title: 'Cache session lookups', meta: ['PR #412 waits on your review', 'then Sam’s'], age: '25m', main: ['Open PR', 'toast', 'Opened PR #412 in the browser'], sec: ['I reviewed it', 'gone', 'T6|Marked PR #412 reviewed'] }),
    live('B44') && row({ ref: 'B44', g: 'failed', title: 'Review found an SQL string built from input', meta: ['Holds PR #93', 'G3 Rate limits per key'], age: '1h', main: ['Make a task', 'gone', 'B44|Made T25 from B44'], sec: ['Open', 'open', 'B44'] }),
    live('B41') && row({ ref: 'B41', g: 'needs', title: 'Reset links expire after 15 minutes wasn’t proven', meta: ['Outcome missed', 'holds G9 Password reset emails open'], age: '1d', main: ['Make a task', 'gone', 'B41|Made T24 from B41'], sec: ['Open', 'open', 'B41'] })
  ];
  const todo = [
    live('H1') && row({ ref: 'H1', g: 'human', title: TASKS.H1.title, meta: ['Your to-do', '3 steps', 'G1 Sign-in with passkeys'], age: '2h', main: ['Done', 'gone', 'H1|H1 done'], sec: ['Talk it over', 'toast', 'Opened a conversation about H1 in Midna'] }),
    live('WR') && row({ ref: 'WR', g: 'needs', title: 'Your week in review is ready', showRef: false, meta: ['Nov 14 – 20', '2 fixes suggested'], age: '3h', titleAct: ['go', 'week'], main: ['Open', 'go', 'week'], later: true })
  ];
  const g3Kids = [
    live('T7') && row({ ref: 'T7', g: 'failed', title: 'Per-key token bucket', meta: ['3 of 212 tests fail under load'], age: '34m', main: ['Try again', 'gone', 'T7|T7 queued again'], later: false }),
    live('T11') && row({ ref: 'T11', g: 'nostart', title: 'Retry-After on every 429', meta: ['Midna is at its terminal limit, 8 of 8'], age: '20m', main: ['Start in a new terminal', 'gone', 'T11|T11 starting in a new terminal'], later: false })
  ].filter(Boolean).join('');
  const stopped = [
    live('G3') && (g3Kids ? row({ ref: 'G3', x: 'b-G3', title: 'Rate limits per key', meta: ['Wave 2 waits', `${g3Kids.match(/<li class/g).length} tasks need a hand`], age: '34m', titleAct: ['goal', 'G3'], main: ['Continue anyway', 'toast', 'Wave 2 of G3 can start now|undo'], kids: g3Kids }) : ''),
    live('T10') && row({ ref: 'T10', g: 'lost', title: 'Move sessions to Redis', meta: ['Terminal lost', 'the work looks finished', 'PR #409'], age: '48m', main: ['Check and finish', 'gone', 'T10|T10 marked done'], sec: ['Resume', 'toast', 'Resuming T10 in a new terminal'] })
  ];
  const n = needsCount();
  return `<div class="col">
  <div class="ph"><div class="t"><h1>Needs you</h1><p class="sum">${n ? `${n} things wait on you` : 'All caught up'} · 4 agents working · 2 goals running</p></div>
    <div class="acts"><button class="btn" data-act="toast" data-arg="Opened a conversation about what needs you in Midna">${ic('talk')}Talk it over</button></div></div>

  ${grp('Decide', decide)}

  ${grp('Stopped', stopped)}
  ${ideasWaiting()}
  ${laterBlock()}
</div>`;
}

function optsHtml(ref) {
  const opts = [['Yes, always', 'Ask for the password before the last passkey goes'], ['Only without a recent sign-in', 'Skip it if they signed in within 10 minutes'], ['No', 'Removing it is enough; they can still use the password']];
  return `<div class="opts" role="radiogroup" aria-label="Answers">${opts.map(([b, s], i) => `<button class="opt${S.sending === ref && S.pick[ref] === i ? ' sending' : ''}" role="radio" aria-checked="${S.pick[ref] === i}" aria-pressed="${S.pick[ref] === i}" data-act="pickopt" data-arg="${ref}|${i}"><span class="r"></span><b>${b}</b><span>${s}</span></button>`).join('')}</div>`;
}
function answerHtml(ref) {
  return `<div class="answer"><label class="field"><span>Other answer</span><textarea class="in" rows="1" data-answer="${ref}" placeholder=""></textarea></label><button class="btn pri${S.sending === ref ? ' sending' : ''}" data-act="send" data-arg="${ref}">${S.sending === ref ? 'Sending' : 'Send'} <span class="kbd">⌘↩</span></button></div>`;
}

function ideasWaiting() {
  const w = IDEAS.filter(i => i.wait && live(i.ref));
  if (!w.length) return '';
  return `<section class="grp" aria-label="Ideas waiting">${grpH('Ideas waiting', w.length)}<ul class="rows">${w.map(i => row({ ref: i.ref, g: 'needs', title: i.title, meta: [i.status, i.note, i.project], titleAct: ['idea', i.ref], main: i.ref === 'I4' ? ['Plan', 'toast', 'Planning I4 · a goal appears when it’s ready|undo'] : ['Answer', 'idea', i.ref], age: i.ref === 'I2' ? '4h' : '1d' })).join('')}</ul></section>`;
}

function laterBlock() {
  const sn = Object.keys(S.snoozed);
  const base = [['T15', 'Bump the session library', 'back at 3:00 PM'], ['H2', 'Confirm the SSO domain', 'waiting on Sam · back Mon, Nov 23']];
  const all = base.concat(sn.map(r => [r, (TASKS[r] || ISSUES[r] || { title: r === 'WR' ? 'Your week in review' : GOALS[r] ? GOALS[r].name : r }).title || GOALS[r].name, S.snoozed[r]]));
  const open = S.open.later;
  return `<section class="grp" aria-label="Later"><div class="grp-h"><button class="btn plain" style="padding:0 4px;margin-left:-4px" data-act="expand" data-arg="later" aria-expanded="${open}">${ic(open ? 'down' : 'chev')}<span style="font-size:var(--fs-title);font-weight:650;color:var(--on-surface)">Later</span></button><span class="n">${all.length}</span></div>
    ${open ? `<ul class="rows">${all.map(([r, t, w]) => row({ ref: r, g: 'paused', title: t, meta: [w], main: ['Bring back now', 'unsnooze', r], later: false, more: false })).join('')}</ul>` : ''}</section>`;
}

// ── Goals ──
function goalRow(r) {
