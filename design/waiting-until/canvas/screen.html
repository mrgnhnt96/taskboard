.side-i .n { font-size: var(--type-caption-font-size); font-weight: 400; }
.page { min-width: 0; overflow: auto; padding: var(--space-page-margin); }
.page-in { max-width: 44rem; display: grid; gap: var(--space-gap-section); }
.grp { display: grid; gap: var(--space-inset-xs); }
.grp-h { padding-left: var(--space-inset); color: var(--color-on-surface-variant); }
.grp-rows { display: grid; padding-left: var(--space-inset-md); }
.prow { gap: var(--space-inset); }
.prow .ref { flex: none; width: 2.25rem; }
.prow .pt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .pill { flex: none; }

/* panel */
.panel { position: absolute; top: 0; bottom: 0; right: 0; z-index: 10; width: 480px; display: flex; flex-direction: column; background: var(--color-surface-raised); border-left: var(--border-width) solid var(--color-divider); box-shadow: var(--elevation-overlay); }
@container screen (width >= 1280px) {
  .app.docked { grid-template-columns: var(--size-sidebar) minmax(0, 1fr) 480px; }
  .app.docked .panel { position: relative; z-index: auto; box-shadow: none; }
}
.ph { flex: none; display: grid; gap: var(--space-inset-xs); padding: var(--space-inset) var(--space-inset-lg) var(--space-inset); }
.crumb { display: flex; align-items: center; gap: var(--space-inset-sm); min-height: var(--size-control-sm); }
.crumb .grow { flex: 1; }
.goal-link { display: inline-flex; align-items: center; min-height: var(--size-control-sm); color: var(--color-goal); font-family: var(--type-label-font-family); font-size: var(--type-label-font-size); font-weight: var(--type-label-font-weight); text-decoration: none; border-radius: var(--radius-inner); }
.goal-link:hover { text-decoration: underline; text-underline-offset: 2px; }
.crumb .sepc { color: var(--color-on-surface-variant); }
.ttl { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ttl:focus-visible { outline-offset: 2px; border-radius: var(--radius-inner); }
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-inset-xs) var(--space-inset-sm); padding-top: var(--space-inset-xs); }
button.chip { gap: var(--space-inset-xs); min-height: var(--size-control-sm); color: var(--color-on-surface); }
button.chip:hover { background: var(--color-surface-hover); }
button.chip[aria-expanded="true"] { background: var(--color-surface-container); border-color: var(--color-outline); }
button.chip[aria-expanded="true"] .chev-d { transform: rotate(180deg); }
.chev-d { transition: transform var(--motion-duration-enter) var(--motion-easing); }
.ptabs { flex: none; display: flex; overflow-x: auto; scrollbar-width: none; gap: var(--space-inset-xs); padding: 0 var(--space-inset-lg) 0 var(--space-inset); box-shadow: inset 0 -1px 0 var(--color-divider); }
.ptabs .tab { min-height: var(--size-control); }
.tab .n { margin-left: var(--space-inset-xs); color: var(--color-on-surface-variant); font-weight: 400; }
.pbody { position: relative; flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: var(--space-inset-md) var(--space-inset-lg) var(--space-gap-section); scroll-padding-bottom: 72px; }
.pbody:focus-visible { outline-offset: calc(var(--focus-width) * -1); }
.pin { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-gap-related); padding: var(--space-inset) var(--space-inset-lg); border-top: var(--border-width) solid var(--color-divider); background: var(--color-surface-raised); }
@container screen (height < 40rem) {
  .panel { overflow: auto; scroll-padding-block: 64px 72px; }
  .ph { display: contents; }
  .crumb { position: sticky; top: 0; z-index: 3; background: var(--color-surface-raised); padding: var(--space-inset-sm) var(--space-inset-lg) 0; }
  .ttl, .facts { padding-inline: var(--space-inset-lg); }
  .facts { padding-bottom: var(--space-inset-sm); }
  .ptabs { position: sticky; top: 32px; z-index: 3; background: var(--color-surface-raised); }
  .pbody { flex: none; overflow: visible; }
  .pin { position: sticky; bottom: 0; z-index: 3; }
}

/* owner's box */
.box { display: grid; gap: var(--space-inset-sm); margin-bottom: var(--space-inset-lg); padding: var(--space-inset) var(--space-inset-md) var(--space-inset-md); border-radius: var(--radius-container); color: var(--color-on-surface); }
.box.needs { background: var(--color-warning-container); }
.box.alarm { background: var(--color-error-container); }
.box.good { background: var(--color-success-container); }
.box.quiet { background: var(--color-surface-container); }
.bh { display: flex; align-items: center; gap: var(--space-inset-sm); font-family: var(--type-label-sm-font-family); font-size: var(--type-label-sm-font-size); font-weight: 700; line-height: var(--type-label-sm-line-height); }
.bh svg { width: 14px; height: 14px; }
.needs .bh { color: var(--color-on-warning-container); }
.alarm .bh { color: var(--color-on-error-container); }
.good .bh { color: var(--color-on-success-container); }
.quiet .bh { color: var(--color-on-surface-variant); }
.bh:focus-visible { outline-offset: 2px; border-radius: var(--radius-inner); }
.bm { font-weight: 700; }
.box .link { font-size: inherit; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-gap-related); padding-top: var(--space-inset-xs); }
.acts.choices { padding-top: 0; }
.acts .grow { flex: 1; }
.box .icon-btn { color: inherit; }
.box .icon-btn:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
.box .cap { font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); }
.tarea { display: block; width: 100%; min-height: 64px; resize: vertical; padding: var(--space-inset-sm) var(--space-inset); border-radius: var(--radius-control); border: var(--border-width) solid var(--color-outline); background: var(--color-surface-raised); color: var(--color-on-surface); font-family: var(--type-body-font-family); font-size: var(--type-body-font-size); line-height: var(--type-body-line-height); }
.tarea:focus-visible { outline: var(--focus-width) solid var(--color-focus-ring); outline-offset: var(--focus-offset); }
.flabel { display: block; padding-bottom: var(--space-inset-xs); font-family: var(--type-label-sm-font-family); font-size: var(--type-label-sm-font-size); font-weight: 700; }
.hint { display: flex; gap: var(--space-inset-sm); align-items: flex-start; font-weight: 700; color: var(--color-on-warning-container); }
.hint svg { margin-top: 1px; }
.tail { display: grid; gap: var(--space-inset-xs); }
.tail > summary, .fold > summary { width: fit-content; display: inline-flex; align-items: center; gap: var(--space-inset-xs); min-height: var(--size-control-sm); padding: 0 var(--space-inset-xs); margin-left: calc(var(--space-inset-xs) * -1); border-radius: var(--radius-inner); font-family: var(--type-label-font-family); font-size: var(--type-label-sm-font-size); font-weight: 700; list-style: none; cursor: default; }
.tail > summary::-webkit-details-marker, .fold > summary::-webkit-details-marker { display: none; }
.tail > summary svg, .fold > summary svg { transition: transform var(--motion-duration-enter) var(--motion-easing); transform: rotate(-90deg); }
.tail[open] > summary svg, .fold[open] > summary svg { transform: none; }
.tail > summary:hover, .fold > summary:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
.out { margin: 0; padding: var(--space-inset-sm) var(--space-inset); border-radius: var(--radius-control); background: var(--color-surface-raised); color: var(--color-on-surface); font-family: var(--type-code-font-family); font-size: var(--type-code-font-size); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.box .out { border: var(--border-width) solid var(--color-divider); }
.hsteps { display: grid; gap: var(--space-inset-sm); counter-reset: hs; }
.hsteps li { counter-increment: hs; display: grid; grid-template-columns: 1.5rem minmax(0, 1fr); }
.hsteps li::before { content: counter(hs) "."; font-weight: 700; color: var(--color-on-surface-variant); }
.quiet .hsteps li { color: var(--color-on-surface-variant); }
.sent { display: grid; gap: var(--space-inset-xs); }
.sent .lbl { font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); }

/* timeline */
.tl { position: relative; display: grid; gap: var(--space-gap-group); }
.tl::before { content: ""; position: absolute; left: 7px; top: 12px; bottom: 12px; width: 2px; border-radius: 1px; background: var(--color-divider); }
.stop { position: relative; display: grid; gap: var(--space-inset-sm); padding-left: 28px; }
.dot { position: absolute; left: 0; top: 2px; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 50%; background: var(--color-surface-raised); border: var(--border-width-strong) solid var(--color-outline); box-shadow: 0 0 0 3px var(--color-surface-raised); color: var(--color-on-success); }
.dot svg { width: 10px; height: 10px; stroke-width: 2.5; }
.dot.ok { background: var(--color-success); border-color: var(--color-success); }
.dot.now { border-width: 5px; border-color: var(--color-primary); }
.dot.you { border-width: 5px; border-color: var(--color-warning); }
.dot.fail { background: var(--color-error); border-color: var(--color-error); color: var(--color-on-error); }
.dot.wait { border-style: dashed; }
.sh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px var(--space-inset-sm); min-height: 20px; }
.sh h3 { font-family: var(--type-label-font-family); font-size: var(--type-label-font-size); font-weight: 700; line-height: var(--type-body-line-height); }
.sh .r { margin-left: auto; font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); white-space: nowrap; }
.sh .link { font-size: var(--type-label-font-size); }
.stop > p { color: var(--color-on-surface-variant); }
.then { font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); }
.nowcard { display: grid; gap: var(--space-inset-sm); padding: var(--space-inset-sm) var(--space-inset) var(--space-inset); border-radius: var(--radius-container); background: var(--color-surface-container); }
.nowcard .nh { display: flex; align-items: center; gap: var(--space-inset-sm); min-height: var(--size-control-sm); }
.nowcard .nh .grow { flex: 1; }
.nowcard .icon-btn:hover, .nowcard .icon-btn[aria-expanded="true"] { background: var(--color-container-hover); color: var(--color-on-surface); }
.icon-btn[aria-expanded="true"] { background: var(--color-surface-pressed); color: var(--color-on-surface); }
.md { display: grid; gap: var(--space-inset-xs); }
.md p, .md li { overflow-wrap: anywhere; }
.md ul { list-style: disc; padding-left: 1.25rem; }
.md code { font-family: var(--type-code-font-family); font-size: var(--type-code-font-size); padding: 0 3px; border-radius: var(--radius-inner); background: var(--color-surface-raised); }
.clamp4 { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.clampw .link { justify-self: start; }

/* PR steps: one row per step */
.steps { display: grid; border-radius: var(--radius-container); border: var(--border-width) solid var(--color-divider); padding: var(--space-inset-xs) 0; }
.step { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: var(--space-inset-sm); min-height: var(--size-control); padding: 0 var(--space-inset); }
.step .sn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step[aria-current="step"] .sn { font-weight: 700; }
.step .ss { display: inline-flex; align-items: center; gap: var(--space-inset-xs); font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); white-space: nowrap; }
.step .si { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 50%; border: var(--border-width-strong) solid var(--color-outline); }
.step .si svg { width: 10px; height: 10px; stroke-width: 2.5; }
.step.ok .si { background: var(--color-success); border-color: var(--color-success); color: var(--color-on-success); }
.step.run .si { border-width: 5px; border-color: var(--color-primary); }
.step.you .si { border-width: 5px; border-color: var(--color-warning); }
.step.stop-x .si { background: var(--color-error); border-color: var(--color-error); color: var(--color-on-error); }
.step.next .si { border-style: dashed; }
button.step { width: 100%; text-align: left; border-radius: 0; }
button.step:hover { background: var(--color-surface-hover); }
button.step:focus-visible { outline-offset: calc(var(--focus-width) * -1); }
button.step[aria-expanded="true"] { background: var(--color-surface-container); }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-gap-related); }

/* Note for testers */
.tnote { display: grid; gap: var(--space-inset-xs); padding: var(--space-inset-sm) var(--space-inset); border-radius: var(--radius-container); border: var(--border-width) solid var(--color-divider); }
.tnote .nh { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-inset-sm); }
.tnote .nk { font-family: var(--type-label-font-family); font-size: var(--type-label-font-size); font-weight: 700; }

/* Brief and Context */
.kv { display: grid; gap: var(--space-gap-section); }
.kvg { display: grid; gap: var(--space-inset-sm); }
.kvh { display: flex; align-items: center; gap: var(--space-inset-sm); min-height: var(--size-control-sm); color: var(--color-on-surface-variant); }
.kvh .grow { flex: 1; }
.kvb { display: grid; gap: var(--space-inset-sm); padding-left: var(--space-inset-md); }
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-inset-sm) var(--space-inset-md); align-items: baseline; }
.dl dt { color: var(--color-on-surface-variant); }
.dl dd { min-width: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-inset-xs) var(--space-inset-sm); }
.mono { font-family: var(--type-code-font-family); font-size: var(--type-code-font-size); }
.files { display: grid; gap: var(--space-inset-xs); }
.prompt { margin: 0; padding: var(--space-inset) var(--space-inset-md); border-radius: var(--radius-control); background: var(--color-surface-container); color: var(--color-on-surface); font-family: var(--type-body-font-family); font-size: var(--type-body-font-size); line-height: var(--type-body-line-height); white-space: pre-wrap; }
.fold { display: grid; gap: var(--space-inset-sm); }
.fold > summary { font-size: var(--type-label-sm-font-size); color: var(--color-on-surface-variant); }
.reading { max-width: 38rem; }
.reading p + p { margin-top: var(--space-inset-sm); }

/* Full log */
.logbar { position: sticky; top: calc(var(--space-inset-md) * -1); z-index: 2; background: var(--color-surface-raised); padding-top: var(--space-inset-md); margin-top: calc(var(--space-inset-md) * -1); display: flex; align-items: center; gap: var(--space-gap-related); padding-bottom: var(--space-inset-sm); }
.logbar .grow { flex: 1; }
.vlist { position: relative; }
.vrow { position: absolute; left: 0; right: 0; height: 40px; border-bottom: var(--border-width) solid var(--color-divider); }
.vrow.open { height: auto; min-height: 40px; }
.vb { width: 100%; height: 100%; min-height: 39px; display: grid; grid-template-columns: 4.75rem minmax(0, 1fr) auto; align-items: center; gap: var(--space-inset-sm); padding: 0 var(--space-inset-xs) 0 var(--space-inset-md); border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: var(--radius-inner); }
.vb:hover { background: var(--color-container-hover); }
.vb:focus-visible { outline: var(--focus-width) solid var(--color-focus-ring); outline-offset: calc(var(--focus-width) * -1); }
.vrow.open .vb { align-items: start; padding-block: 10px; }
.vrow.open .tx { white-space: normal; overflow: visible; }
.vrow .tm { font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); white-space: nowrap; }
.vrow .tx { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vrow .kd { font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); }
.vrow.day { display: flex; align-items: end; padding-left: 0; border-bottom: 0; padding-bottom: var(--space-inset-xs); color: var(--color-on-surface-variant); }
.logempty { padding: var(--space-inset-lg) 0; color: var(--color-on-surface-variant); }

/* popovers */
.pop { position: absolute; display: grid; gap: var(--space-inset-xs); width: 320px; max-height: 360px; padding: var(--space-inset-sm); border-radius: var(--radius-container); background: var(--color-surface-raised); color: var(--color-on-surface); border: var(--border-width) solid var(--color-divider); box-shadow: var(--elevation-overlay); animation: fade var(--motion-duration-enter) var(--motion-easing); }
.pop:focus { outline: none; }
.pop .pg { display: grid; }
.pop .pgh { display: flex; align-items: center; gap: var(--space-inset-sm); min-height: var(--size-control-sm); padding: 0 var(--space-inset-sm); color: var(--color-on-surface-variant); }
.pop .pgh .grow { flex: 1; }
.pop .pgr { display: grid; padding-left: var(--space-inset-md); }
.pop .row { min-height: var(--size-control); padding: 0 var(--space-inset-sm); gap: var(--space-inset-sm); }
.pop .row .pt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.pop .row svg { color: var(--color-on-surface-variant); }
.pop .vwrap { position: relative; overflow: auto; max-height: 240px; overscroll-behavior: contain; }
.pop .vwrap .row { position: absolute; left: 0; right: 0; }
.pop .state { display: grid; justify-items: start; gap: var(--space-inset-sm); padding: var(--space-inset-sm); color: var(--color-on-surface-variant); }
.pop .upd { display: inline-flex; align-items: center; gap: var(--space-inset-xs); font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); }
.pop .upd .spin { width: 12px; height: 12px; }
.pop .stale .row { opacity: .6; }

/* dialogs and toasts */
.scrim { inset: 0; }
.dialog h2 { font-family: var(--type-title-font-family); font-size: var(--type-title-font-size); font-weight: 700; line-height: var(--type-title-line-height); }
.dialog h2:focus-visible { outline-offset: 2px; border-radius: var(--radius-inner); }
.dialog .dname { color: var(--color-on-surface); font-weight: 700; }
.dialog .derr { display: flex; gap: var(--space-inset-sm); align-items: flex-start; color: var(--color-on-error-container); font-weight: 700; }
.dialog .derr svg { margin-top: 1px; }
.dialog .sk { margin: 3px 0; }
.dialog .dnote { max-height: 50cqh; overflow: auto; padding-right: var(--space-inset-sm); }
.dialog .dnote p, .dialog .dnote li { color: var(--color-on-surface); }
.dialog .actions .grow { flex: 1; }
.dialog .actions { align-items: center; }
.ptoasts { position: absolute; left: 0; right: 0; bottom: var(--space-inset-lg); z-index: 30; display: flex; flex-direction: column; align-items: center; gap: var(--space-gap-related); padding: 0 var(--space-inset-md); pointer-events: none; }
.ptoasts .toast { animation: rise var(--motion-duration-enter) var(--motion-easing); }
.tipl { position: absolute; z-index: 40; pointer-events: none; animation: fade var(--motion-duration-enter) var(--motion-easing); }
.layer .menu { max-height: 360px; }
.mi .mi-s { display: block; font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); }
.mi.is-active .mi-s { color: var(--color-on-primary); }
.mi:not(.is-active):not(:disabled):hover { background: var(--color-surface-container); }
.mi:disabled { opacity: var(--opacity-disabled); }

/* Today's app screen */
.today { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--color-surface); color: var(--color-on-surface); font-family: var(--type-body-font-family); font-size: var(--type-body-font-size); }
.today-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-inset-sm) var(--space-gap-group); padding: var(--space-inset-sm) var(--space-inset-md); border-bottom: var(--border-width) solid var(--color-divider); }
.today-bar .grow { flex: 1; }
.today-fig { min-height: 0; display: grid; place-items: center; padding: var(--space-inset-md); }
.today-fig img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: var(--radius-control); box-shadow: 0 0 0 1px var(--color-divider), var(--elevation-raised); }
.ptabs .tab { white-space: nowrap; }
.nowcard > .link, .tnote > .link, .md + .link { justify-self: start; }
.app.wide .page-in { max-width: none; }
@container screen (height < 40rem) { .crumb, .ttl, .facts, .ptabs, .pin { flex: none; } }

@container screen (height < 40rem) { .logbar { top: calc(32px + var(--size-control)); } }
.nowcard .link, .box .link { color: var(--color-on-primary-container); }
.startat { display: grid; gap: 0; }
.startat #startout:empty { display: none; }
.startat #startout { padding-top: var(--space-inset-xs); }

.logday { margin-left: auto; color: var(--color-on-surface-variant); }
.startat #startout.bad { color: var(--color-error); }
.panel .link { text-decoration: none; }
.panel .link:hover, .panel .link:focus-visible { text-decoration: underline; }
@container screen (height < 40rem) {
  .ttl { display: block; -webkit-line-clamp: none; overflow: visible; }
  .crumb { position: static; }
  .ptabs { top: 0; }
  .logbar { top: var(--size-control); }
}

/* ---------- Waiting until a set time ---------- */
/* base.css is the shared look from the task panel design; this adds the waiting pieces and the
   two pages behind the panel. */
.app { --chip-w: 104px; font-family: var(--type-body-font-family); font-size: var(--type-body-font-size); line-height: var(--type-body-line-height); }
.side { grid-auto-rows: max-content; min-height: 0; overflow-y: auto; }
button.side-i { width: 100%; text-align: left; }
button.side-i:hover { background: var(--color-surface-hover); color: var(--color-on-surface); }
.side-i .dotc { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-right: var(--space-inset-sm); }
.side-i .nm { flex: 1; }
.side-i .n.loud { color: var(--color-on-warning-container); font-weight: 700; }
.side-h { margin: var(--space-gap-section) 0 var(--space-inset-sm); padding: 0 var(--space-inset-sm); }
.sgoal { display: grid; gap: var(--space-inset-xs); padding: var(--space-inset-sm); border-radius: var(--radius-control); }
.sgoal .nm { display: flex; gap: var(--space-inset-sm); font-family: var(--type-label-font-family); font-size: var(--type-label-font-size); }
.sgoal .sub { display: flex; justify-content: space-between; gap: var(--space-inset-sm); font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); }
.sgoal .sub .loud { color: var(--color-on-warning-container); }
.ref { color: var(--color-goal); font-family: var(--type-code-font-family); font-size: var(--type-code-font-size); }
.over { font-family: var(--type-label-sm-font-family); font-size: var(--type-label-sm-font-size); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--color-on-surface-variant); }
.over .n { margin-left: var(--space-inset-sm); }

/* status chip: one fixed width so rows line up */
.st { justify-content: center; min-width: var(--chip-w); font-weight: 700; }
/* Waiting: the Working blue, hollow, since nothing runs until the resume time */
.pill.waiting { background: transparent; color: var(--color-on-primary-container); box-shadow: inset 0 0 0 1px var(--color-primary); }
.pill.queued { background: var(--color-surface-container); color: var(--color-on-surface-variant); }
.pill.planned2 { background: transparent; color: var(--color-on-surface-variant); box-shadow: inset 0 0 0 1px var(--color-outline-variant); }

/* status bar */
.sbar { display: flex; gap: 2px; height: 4px; border-radius: 2px; overflow: hidden; background: var(--color-divider); }
.sbar i { display: block; }
.sbar .done { background: var(--color-success); }
.sbar .working { background: var(--color-primary); }
.sbar .waiting { background: color-mix(in srgb, var(--color-primary) 45%, transparent); }
.sbar .needs { background: var(--color-warning); }
.sbar .queued, .sbar .planned { background: var(--color-outline-variant); }

/* page */
.page { display: grid; align-content: start; }
.page-in { max-width: 60rem; }
.ph1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-inset-sm) var(--space-inset); }
.grp2 { display: grid; gap: var(--space-inset-sm); }

/* Needs you card (as the app draws it) */
.nyc { display: grid; gap: var(--space-inset-xs); padding: var(--space-inset) var(--space-inset-md); border-radius: var(--radius-container); background: var(--color-warning-container); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-warning) 40%, transparent); }
.nyc-top { display: flex; align-items: center; gap: var(--space-inset); }
.nyc-t { flex: 1; min-width: 0; display: grid; }
.nyc-g { font-size: var(--type-caption-font-size); color: var(--color-goal); }
.nyc-title { justify-self: start; font-family: var(--type-label-font-family); font-size: var(--type-label-font-size); font-weight: 700; border-radius: var(--radius-inner); text-align: left; cursor: pointer; }
.nyc-title:hover { text-decoration: underline; }
.nyc-acts { display: flex; gap: var(--space-inset-sm); flex: none; }
.nyc .age { flex: none; min-width: 2.5rem; text-align: right; font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); }
.nyc-q { color: var(--color-on-warning-container); }
.nyc-plan { color: var(--color-on-surface-variant); }
.nyc-acts .btn.secondary { background: var(--color-surface-raised); }
@container screen (width < 1100px) {
  .nyc-top { flex-wrap: wrap; }
  .nyc-t { flex-basis: 100%; }
  .nyc-acts { order: 2; margin-left: auto; }
  .nyc .age { order: 3; }
}

/* Project page: goal blocks and task rows */
.gblock { border: var(--border-width) solid var(--color-divider); border-radius: var(--radius-container); background: var(--color-surface-raised); overflow: hidden; }
.ghead { display: grid; grid-template-columns: 24px 2.5rem minmax(0, 1fr) 9rem var(--chip-w); align-items: center; gap: var(--space-inset); width: 100%; min-height: 56px; padding: var(--space-inset-sm) var(--space-inset); text-align: left; }
.ghead:hover { background: var(--color-surface-hover); }
.gblock.open .ghead { background: var(--color-surface-container); }
.ghead .chev { transform: rotate(-90deg); transition: transform var(--motion-duration-enter) var(--motion-easing); }
.gblock.open .ghead .chev { transform: none; }
.ghead .gname { font-family: var(--type-label-font-family); font-size: var(--type-label-font-size); font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ghead .gprog { display: grid; gap: var(--space-inset-xs); font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); }
.ghead .gprog .loud { color: var(--color-on-warning-container); }
.trows { display: grid; padding: var(--space-inset-xs) 0; }
.trows[hidden] { display: none; }
.trow { display: grid; grid-template-columns: 2.5rem minmax(9rem, 18rem) minmax(0, 1fr) var(--chip-w); grid-template-areas: "ref title line chip"; align-items: center; gap: 2px var(--space-inset); width: 100%; min-height: var(--size-row); padding: var(--space-inset-xs) var(--space-inset) var(--space-inset-xs) calc(var(--space-inset) * 2 + 24px); text-align: left; cursor: pointer; }
.trow:hover { background: var(--color-surface-hover); }
.trow[aria-current="true"] { background: var(--color-primary-container); box-shadow: inset 3px 0 0 var(--color-primary); }
.trow:focus-visible { outline-offset: calc(var(--focus-width) * -1); }
.trow .tref { grid-area: ref; color: var(--color-on-surface-variant); font-family: var(--type-code-font-family); font-size: var(--type-code-font-size); }
.trow .ttitle { grid-area: title; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .tline { grid-area: line; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); }
.trow .tline.loud { color: var(--color-on-warning-container); }
.trow .tline .at { color: var(--color-on-surface); font-weight: 700; }
.trow .tline.loud .at { color: inherit; }
.trow .pill { grid-area: chip; }
@container screen (width < 1240px) {
  .trow { grid-template-columns: 2.5rem minmax(0, 1fr) var(--chip-w); grid-template-areas: "ref title chip" ". line chip"; }
  .ghead { grid-template-columns: 24px 2.5rem minmax(0, 1fr) var(--chip-w); }
  .ghead .gprog { grid-column: 3; grid-row: 2; }
}
.app.docked .trow { grid-template-columns: 2.5rem minmax(0, 1fr) var(--chip-w); grid-template-areas: "ref title chip" ". line chip"; }
.app.docked .ghead { grid-template-columns: 24px 2.5rem minmax(0, 1fr) var(--chip-w); }
.app.docked .ghead .gprog { grid-column: 3; grid-row: 2; }

/* panel: the waiting box and its timeline dot */
.box.wait { background: var(--color-surface-container); }
.wait .bh { color: var(--color-on-surface); }
.bh { text-transform: uppercase; letter-spacing: .04em; }
.dot.waitd { border-style: dashed; border-color: var(--color-primary); }
.nowcard .cap { font-size: var(--type-caption-font-size); color: var(--color-on-surface-variant); }
.nowcard p { margin: 0; }
.page .scrim2 { display: none; }
@container screen (width < 1280px) {
  .app.open .page { pointer-events: none; }
  .app.open::after { content: ""; position: absolute; inset: 0 480px 0 0; background: var(--color-scrim); z-index: 5; }
}
@container screen (width < 900px) {
  .panel { width: min(480px, calc(100% - 64px)); }
  .app.open::after { right: min(480px, calc(100% - 64px)); }
}
.sh h3 + .muted { font-size: var(--type-caption-font-size); }
.nowcard .fit { justify-self: start; }
</style>
<section data-screen="project" data-title="Project page">
  <div class="app" data-app="project"></div>
</section>
<section data-screen="panel" data-title="Task panel">
  <div class="app" data-app="panel"></div>
</section>
<section data-screen="needs" data-title="Needs you">
  <div class="app" data-app="needs"></div>
</section>
</template>
<script>
window.ultrahandSetup = function (canvas) {
  const R = canvas.root;
  const q = (s, el) => (el || R).querySelector(s);
  const qa = (s, el) => [...(el || R).querySelectorAll(s)];

  const I = {
    x: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
    chev: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>',
    more: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="12.5" cy="8" r="1.1" fill="currentColor" stroke="none"/></svg>',
    clock: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.75V8l2.25 1.5"/></svg>',
    alert: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.75v4M8 11.25v.01"/></svg>',
    check: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>'
  };

  /* ---------- what each state shows ---------- */
  const PLAN = 'Read the 5:00 PM benchmark run, then compare it with the numbers from before the change.';
  const PLAN_AM = 'Read the overnight benchmark run, then compare it with the numbers from before the change.';
  const S = {
    waiting: { at: '6:30 PM', plan: PLAN, last: 'Nothing more can be checked before the 5:00 PM benchmark run.' },
    tomorrow: { at: 'tomorrow 6:30 AM', plan: PLAN_AM, last: 'Nothing more can be checked before the overnight benchmark run.' },
    overdue: { at: '6:30 PM', plan: PLAN, last: 'Nothing more can be checked before the 5:00 PM benchmark run.' },
    resumed: { at: '6:30 PM', plan: PLAN, last: 'Reading the 5:00 PM benchmark run.' }
  };
  const st = () => S[canvas.state] ? canvas.state : 'waiting';
  const parked = () => st() === 'waiting' || st() === 'tomorrow';

  /* The waiting task's row: Waiting right after Working; when it misses its time it is a Needs you row. */
  function t10() {
    const s = S[st()];
    if (parked()) return { ref: 'T10', title: 'Re-measure and compare', line: `<span class="at">Resumes ${s.at}</span> · ${s.plan}`, chip: ['waiting', 'Waiting'], rank: 2.5 };
    if (st() === 'overdue') return { ref: 'T10', title: 'Re-measure and compare', line: `<span class="at">Didn't resume at ${s.at}</span> · ${s.plan}`, loud: true, chip: ['needs', 'Needs you'], rank: 0 };
    return { ref: 'T10', title: 'Re-measure and compare', line: s.last.replace(/\.$/, '') + ' · 1m', chip: ['working', 'Working'], rank: 2 };
  }
  function g2rows() {
    return [
      { ref: 'T6', title: 'Measure the sign-in path', line: '412 ms median before the change', chip: ['done', 'Done'], rank: 8 },
      { ref: 'T7', title: 'Cache the user lookup', line: 'PR #951 merged', chip: ['done', 'Done'], rank: 8.1 },
      { ref: 'T8', title: 'Batch the session writes', line: 'Moving the writes behind one flush · 1h 5m', chip: ['working', 'Working'], rank: 2 },
      t10(),
      { ref: 'T9', title: 'Drop the extra redirect', line: 'Waits for a free terminal', chip: ['queued', 'Queued'], rank: 6 },
      { ref: 'T11', title: 'Write up the numbers', line: '', chip: ['planned2', 'Planned'], rank: 7 }
    ].sort((a, b) => a.rank - b.rank);
  }
  const g2bar = () => {
    const w = { waiting: 'waiting', tomorrow: 'waiting', overdue: 'needs', resumed: 'working' }[st()];
    return [['done', 2], ['working', 1], [w, 1], ['queued', 1], ['planned', 1]];
  };
  const bar = (parts) => `<span class="sbar" aria-hidden="true">${parts.map(([c, n]) => `<i class="${c}" style="flex:${n}"></i>`).join('')}</span>`;
  const chip = ([c, l]) => `<span class="pill st ${c}">${l}</span>`;

  /* ---------- sidebar ---------- */
  function side(active) {
    const needsN = st() === 'overdue' ? 2 : 1;
    const item = (nav, label, color, n, loud) =>
      `<button class="side-i${active === nav ? ' on' : ''}" ${nav ? `data-nav="${nav}"` : 'data-say="Not part of this design"'}${active === nav ? ' aria-current="page"' : ''}><span class="dotc" style="background:${color}"></span><span class="nm">${label}</span>${n ? `<span class="n${loud ? ' loud' : ''}">${n}</span>` : ''}</button>`;
    const g2sub = st() === 'overdue' ? `<span class="loud">2 of 6 · Didn't resume</span>` : '<span>2 of 6</span>';
    return `<nav class="side" aria-label="Pages">
      ${item('needs', 'Needs you', 'var(--color-warning)', needsN, true)}
      ${item('project', 'Projects', 'var(--color-on-surface-variant)', 2)}
      ${item('', 'Goals', 'var(--color-goal)', 2)}
      ${item('', 'Backlog', 'var(--color-outline)', 2)}
      ${item('', 'Ideas', 'var(--color-goal)', 0)}
      ${item('', 'Days', 'var(--color-info)', 0)}
      <h2 class="over side-h">Active goals</h2>
      <div class="sgoal"><span class="nm"><span class="ref">G1</span>Sign-in with passkeys</span>${bar([['done', 1], ['working', 1], ['needs', 1], ['planned', 1]])}<span class="sub"><span class="loud">1 of 4 · Needs your answer</span></span></div>
      <div class="sgoal"><span class="nm"><span class="ref">G2</span>Faster sign-in</span>${bar(g2bar())}<span class="sub">${g2sub}</span></div>
    </nav>`;
  }

  /* ---------- Project page ---------- */
  function project(openRef) {
    const rows = g2rows().map((r) => `<button class="trow" data-open="${r.ref}" title="${r.line.replace(/<[^>]+>/g, '')}"${openRef === r.ref ? ' aria-current="true"' : ''}><span class="tref">${r.ref}</span><span class="ttitle">${r.title}</span><span class="tline${r.loud ? ' loud' : ''}">${r.line}</span>${chip(r.chip)}</button>`).join('');
    const g2chip = st() === 'overdue' ? ['needs', 'Needs you'] : ['working', 'Working'];
    return `<main class="page" aria-labelledby="ph"><div class="page-in">
      <h1 class="t-headline" id="ph">webapp</h1>
      <div class="grp2">
        <div class="gblock open">
          <button class="ghead" aria-expanded="true" data-act="fold"><span class="chev">${I.chev}</span><span class="ref">G2</span><span class="gname">Faster sign-in</span><span class="gprog">${bar(g2bar())}<span>2 of 6 · wave 2</span></span>${chip(g2chip)}</button>
          <div class="trows">${rows}</div>
        </div>
        <div class="gblock">
          <button class="ghead" aria-expanded="false" data-act="fold"><span class="chev">${I.chev}</span><span class="ref">G1</span><span class="gname">Sign-in with passkeys</span><span class="gprog">${bar([['done', 1], ['working', 1], ['needs', 1], ['planned', 1]])}<span>1 of 4</span></span>${chip(['needs', 'Needs you'])}</button>
          <div class="trows" hidden>
            <button class="trow" data-say="Not part of this design"><span class="tref">T3</span><span class="ttitle">Settings page: manage passkeys</span><span class="tline loud">Question: Should removing the last passkey require a password re-check?</span>${chip(['needs', 'Needs you'])}</button>
            <button class="trow" data-say="Not part of this design"><span class="tref">T2</span><span class="ttitle">Sign in with a passkey</span><span class="tline">Wiring the assertion check into the session middleware</span>${chip(['working', 'Working'])}</button>
            <button class="trow" data-say="Not part of this design"><span class="tref">T4</span><span class="ttitle">Docs: passkey support</span><span class="tline"></span>${chip(['planned2', 'Planned'])}</button>
            <button class="trow" data-say="Not part of this design"><span class="tref">T1</span><span class="ttitle">Add the WebAuthn registration endpoint</span><span class="tline">Registration endpoint and tests are in</span>${chip(['done', 'Done'])}</button>
          </div>
        </div>
      </div>
    </div></main>`;
  }

  /* ---------- Needs you page ---------- */
  function needs() {
    const over = st() === 'overdue';
    const n = over ? 2 : 1;
    const acts = `<div class="nyc-acts"><button class="btn secondary sm" data-say="Opens its terminal in Midna">Open terminal</button><button class="btn secondary sm" data-say="Later menu, as today">Later <span class="chev-d">${I.chev}</span></button><button class="btn secondary sm" data-say="More menu, as today">More <span class="chev-d">${I.chev}</span></button></div>`;
    const card = (goal, ref, title, q, plan, age) => `<article class="nyc" aria-label="${title}">
      <div class="nyc-top"><div class="nyc-t"><span class="nyc-g">${goal}</span><button class="nyc-title" data-open="${ref}">${title}</button></div>${acts}<span class="age">${age}</span></div>
      <p class="nyc-q">${q}</p>${plan ? `<p class="nyc-plan">${plan}</p>` : ''}
    </article>`;
    const late = over ? card('Faster sign-in', 'T10', 'Re-measure and compare', `Didn't resume at ${S.overdue.at}`, S.overdue.plan, '22m') : '';
    return `<main class="page" aria-labelledby="ph"><div class="page-in">
      <div class="ph1"><h1 class="t-headline" id="ph">Needs you</h1><span class="muted">${n} agent${n > 1 ? 's' : ''} waiting</span></div>
      <div class="grp2" role="group" aria-labelledby="gw">
        <h2 class="over" id="gw">Agents waiting<span class="n">${n}</span></h2>
        ${late}
        ${card('Sign-in with passkeys', 'T3', 'Settings page: manage passkeys', 'Should removing the last passkey require a password re-check?', '', '4m')}
      </div>
    </div></main>`;
  }

  /* ---------- Task panel ---------- */
  const stop = (dot, inner) => `<li class="stop"><span class="dot ${dot}">${dot === 'ok' ? I.check : ''}</span>${inner}</li>`;
  const nowcard = (head, cap, text, extra) => `<div class="nowcard"><div class="nh">${head}<span class="cap">${cap}</span><span class="grow"></span><button class="icon-btn" aria-label="More" data-say="More menu, as today">${I.more}</button></div><p>${text}</p>${extra || ''}<p class="then">Then: Pull request, Checks, Review, Merge</p></div>`;
  function panel(ref) {
    if (ref !== 'T10') return '';
    const s = S[st()];
    let box = '', now = '', past = '';
    if (parked()) {
      box = `<section class="box wait" aria-labelledby="bh"><h3 class="bh" id="bh">${I.clock}Waiting · resumes ${s.at}</h3><p class="bm">${s.plan}</p></section>`;
      now = stop('waitd', nowcard(chip(['waiting', 'Waiting']), 'after 52m of work · since 1:48 PM', s.last));
    } else if (st() === 'overdue') {
      box = `<section class="box needs" aria-labelledby="bh"><h3 class="bh" id="bh">${I.alert}Didn't resume at ${s.at}</h3><p class="bm">${s.plan}</p><div class="acts"><button class="btn primary" data-say="Focusing it in Midna">Focus in Midna</button></div></section>`;
      now = stop('you', nowcard(chip(['needs', 'Needs you']), 'after 52m of work · since 6:45 PM', s.last));
    } else {
      now = stop('now', nowcard(chip(['working', 'Working']), 'under a minute · updated just now', s.last, `<button class="btn secondary sm fit" data-say="Focusing it in Midna">Focus in Midna</button>`));
      past = stop('waitd', `<div class="sh"><h3>Waited until 6:30 PM</h3><span class="r">6:31 PM</span></div><p>${PLAN}</p>`);
    }
    const started = stop('ok', `<div class="sh"><h3>Started</h3><span class="muted">Baseline from the sign-in path saved</span><span class="r">12:56 PM</span></div>`);
    return `<aside class="panel" aria-labelledby="ttl">
      <header class="ph">
        <div class="crumb"><a class="goal-link" href="#" data-say="Opens the goal">G2 Faster sign-in</a><span class="sepc" aria-hidden="true">›</span><span class="t-label muted">T10</span><span class="grow"></span><button class="icon-btn" data-act="close" aria-label="Close task panel" data-tip="Close · Esc">${I.x}</button></div>
        <h2 class="t-title-lg ttl" id="ttl" tabindex="-1">Re-measure and compare</h2>
        <div class="facts"><span class="chip">webapp</span><span class="chip">Wave 2 · 4 of 6</span></div>
      </header>
      <div class="ptabs" role="tablist" aria-label="Task">
        <button class="tab" role="tab" aria-selected="true" data-label="Timeline">Timeline</button>
        <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-label="Brief" data-say="Brief tab, as today">Brief</button>
        <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-label="Context" data-say="Context tab, as today">Context</button>
        <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-label="Full log 18" data-say="Full log, as today"><span>Full log<span class="n">18</span></span></button>
      </div>
      <div class="pbody" role="tabpanel" aria-label="Timeline" tabindex="0">${box}<ol class="tl">${now}${past}${started}</ol></div>
    </aside>`;
  }

  /* ---------- render ---------- */
  const open = { project: null, panel: 'T10', needs: null };
  let opener = null;
  function render(id, focusPanel) {
    const app = q(`[data-app="${id}"]`);
    if (!app) return;
    const page = id === 'needs' ? needs() : project(open[id]);
    app.innerHTML = side(id === 'needs' ? 'needs' : 'project') + page + panel(open[id]);
    app.classList.toggle('open', !!open[id]);
    app.classList.toggle('docked', !!open[id]);
    setInert(app);
    if (focusPanel) q('#ttl', app)?.focus();
    canvas.refresh();
  }
  /* under 1280 the panel overlays the page: keep Tab inside it */
  function setInert(app) {
    const overlay = !!open[app.dataset.app] && app.offsetWidth < 1280;
    qa('.side, .page', app).forEach((el) => { el.inert = overlay; });
  }
  const ro = new ResizeObserver((es) => es.forEach((e) => setInert(e.target)));
  qa('.app').forEach((a) => ro.observe(a));
  const renderAll = () => ['project', 'panel', 'needs'].forEach((id) => render(id));

  R.addEventListener('click', (e) => {
    const app = e.target.closest('.app');
    if (!app) return;
    const id = app.dataset.app;
    if (e.target === app && open[id]) { close(id); return; }
    const say = e.target.closest('[data-say]');
    if (say) { e.preventDefault(); canvas.toast(say.dataset.say); return; }
    const o = e.target.closest('[data-open]');
    if (o) { opener = o.dataset.open; open[id] = o.dataset.open; render(id, true); return; }
    const a = e.target.closest('[data-act]');
    if (!a) return;
    if (a.dataset.act === 'close') close(id);
    if (a.dataset.act === 'fold') {
      const blk = a.closest('.gblock');
      const on = !blk.classList.contains('open');
      blk.classList.toggle('open', on);
      a.setAttribute('aria-expanded', on);
      q('.trows', blk).hidden = !on;
      canvas.refresh();
    }
  });
  function close(id) {
    const ref = open[id];
    open[id] = null;
    render(id);
    const back = ref && q(`[data-app="${id}"] [data-open="${ref}"]`);
    if (back) back.focus();
  }
  R.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const app = e.target.closest && e.target.closest('.app');
    if (app && open[app.dataset.app]) { e.preventDefault(); close(app.dataset.app); }
  });

  canvas.onState(renderAll);
  canvas.onNavigate(() => renderAll());
};
</script>
