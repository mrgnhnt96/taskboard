[workspace]
resolver = "3"
members = ["crates/taskboardd", "crates/taskboard-cli", "crates/taskboard-app"]

[workspace.package]
version = "0.1.0-beta.15"
edition = "2021"
license = "MIT"

[workspace.dependencies]
taskboardd = { path = "crates/taskboardd" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
