# taskboard configuration. Copy to ~/.config/taskboard/config.toml (or point TASKBOARD_CONFIG at it).
# Every key is optional; the values below are the defaults unless marked "example".

# The person who runs the board. Agents are told to ask them; defaults to the first name in
# `git config --global user.name`.
# owner = "Alex"                      # example

host = "127.0.0.1"
port = 8792                          # env TASKBOARD_PORT
data = "~/.config/taskboard"         # env TASKBOARD_DATA: tasks.db, tasks/T<n>.md, spool/, statusline/, server.log
# page_url = "taskboard://"   # where a clicked notification goes (Taskboard.app's URL scheme)

# Midna, the terminal app the board drives through its CLI (`midna call …`).
midna = "~/.local/bin/midna"         # env TASKBOARD_MIDNA
midna_bundle = "com.mrgnhnt.midna"   # opened with `open -g -b` when Midna isn't running
open_midna = true
notify = true                        # desktop notifications through Midna
first_weekday = "sun"                # the day weeks start on: the Days page's week and the hours menu's days

claude = "claude"                    # env TASKBOARD_CLAUDE; used for question screening (and Jira with via = "claude")
claude_projects = "~/.claude/projects"

# The runner starts terminals, sends messages and moves Jira tickets. It's on for the default data
# directory and off for any other (so a test board never opens terminals). env TASKBOARD_RUNNER=1|0
# runner = true

# Your commit emails: a push of yours is cancelled while PR builds are stopped (`tb pr-builds stop`),
# and a red default branch ([master]) is yours when your commits are among its suspects.
# owner_emails = ["alex@acme.dev"]     # example

[intervals]
runner = 5.0
spool = 10.0
prs = 60.0
midna_sync = 3.0
midna_up = 20.0
running_job_expiry = 360.0
pending_job_expiry = 3600.0
gone_after_missed = 2
md_debounce = 1.0

# The hours agents may start in. Change them later from the page or with `tb hours`.
[work_hours]
on = false
start = "09:00"
end = "17:00"
days = ["mon", "tue", "wed", "thu", "fri"]
alert_every_mins = 10

# Alerts' desktop notifications (through Midna). Each carries these snooze buttons, in minutes (at most
# four; [] for none). Urgent alerts (`tb alert raise --urgent`) repeat outside the work hours too.
[alerts]
snooze_mins = [15, 30, 60]

# Screen agents' questions with a headless `claude -p` first: when the rules already answer a
# question, the agent gets the answer and the owner isn't asked.
[questions]
screen = false
model = "claude-haiku-5-5"
budget_usd = "0.30"
timeout_secs = 75
# Rule files the screener reads: a file, a folder (its MEMORY.md, then every other .md in it, so a
# new memory note counts at once) or a glob (`*`, `?`, `[…]`, `**` for any depth of folders).
rules = []                           # example: ["~/.claude/CLAUDE.md", "~/.claude/projects/-Users-alex-code-web/memory", "~/.claude/projects/*/memory/*.md"]

# Planning from the backlog (the app's Backlog page). A headless `claude -p` sorts new issues (area,
# impact, priority, and which are the same kind of work) and splits the issues picked for a goal into
# waves. Off, or without `claude`, issues are grouped by kind and waves follow priority.
[backlog]
ai = true
model = "sonnet"
budget_usd = "1.00"
timeout_secs = 240
max_terminals = 2                    # how many terminals a goal made from the backlog runs at once

# Pull requests. Any GitHub, GitLab or Bitbucket PR link an agent reports is linked to its task.
# GitHub PRs are watched with the gh CLI (which must be logged in).
[pr]
watch = true
wake = true                          # bring a done task back when its PR has failed checks or comments
agents_merge = false                 # let agents merge an approved, green PR
gh = "gh"
no_checks_after_mins = 15.0
bitbucket_api = "https://api.bitbucket.org/2.0"
azure_token_env = "AZURE_DEVOPS_EXT_PAT"  # env var with an Azure DevOps token, to read failed steps and tests, when none is stored with `tb ci-token set`
approvals = 2                        # approvals a PR needs before it's ready to merge, when its project doesn't say (0: the host's decision, or any approval)

# Per-project PR rules, by project name. Every key is optional. `tb project set <name> --approvals N
# --expected-check <check> --expected-wait <mins>` changes the first three on the board, over these.
# [pr.projects.webapp]
# approvals = 2                       # approvals needed before it's ready to merge (unset: pr.approvals; 0: the host's decision)
# expected = ["build", "test"]        # checks that must post on every push ([] = don't wait; unset = the no_checks_after_mins grace)
# expected_wait_mins = 90             # how long to wait for them
# failures_cmd = "~/bin/ci-failures"  # prints a failed check's steps and tests for CI the board can't read (see docs/API.md)
# merge_strategy = "squash"           # how tb pr merge merges (unset: the repository's default)

# PR updates from a feed: a listener (a Slack app on the team's git-notification channel, a webhook
# relay) posts one event per PR change or build to POST /prs/event (`tb feed event <pr link>`) and
# the board reads that PR again. Events refresh their PR whether or not this is on. With `on`, the
# board watches the feed's health: stuck (heartbeats stopped) or silent (nothing at all inside the
# work hours) holds reviewer asks, nudges and swaps, brings back the poll, restarts the feed at
# restart_mins and raises the `pr-feed` alert when that doesn't help. See docs/API.md ("The PR feed").
[feed]
on = false
listener = ""                        # a command the board runs and keeps running (gets TASKBOARD_URL, TB_EVENT_URL)
restart_cmd = ""                     # example: "launchctl kickstart -k gui/501/com.me.pr-listener" (empty: restart the listener)
stuck_secs = 180.0                   # no heartbeat (POST /prs/heartbeat) this long, once the feed has sent one
silent_secs = 3600.0                 # no event or heartbeat this long inside the work hours
restart_mins = [1.0, 5.0, 15.0]      # minutes after it went bad at which the board restarts it
poll_while_healthy = false           # keep polling every PR ([intervals] prs) while the feed is healthy too

# PR builds stopped (`tb pr-builds stop`, on your word): every build of your PRs and your pushes is
# cancelled when the board hears of it (a build event on the feed, or a running check on a poll), and
# the PRs' checks count as passed. A cancel that fails is tried again after each of retry_secs, then
# alerts. See docs/API.md ("PR builds").
[pr_builds]
retry_secs = [0.0, 10.0, 30.0, 60.0, 120.0]
timeout_secs = 30.0
follow_up_secs = [10.0, 30.0, 60.0, 120.0]   # after a cancel, sweep the push again (builds queued late)

# The command that cancels builds, by CI provider (github, bitbucket, azure, or the `provider` a
# build event names). Run with `sh -c` and TB_PROVIDER, TB_PR_URL, TB_PR_REPO, TB_PR_NUM, TB_HEAD,
# TB_BRANCH, TB_BUILD_URL, TB_BUILD_ID; exit 0 once they're cancelled. Unset for github and
# bitbucket: the PR host's own (gh run cancel, Pipelines' stopPipeline).
[pr_builds.cancel]
# azure = "az pipelines runs cancel --id \"$TB_BUILD_ID\""   # example

# Master breaks: watch each listed project's default branch. A failed check on its head opens a
# break (M<n>, `tb master`); it's yours when your commits (owner_emails) are among the suspects and
# a headless Claude agrees. Only yours gets a fix task and an urgent alert; green closes it. The app
# shows "Master is red". See docs/API.md ("Master breaks").
[master]
every_mins = 5.0                     # how often each branch is read
commits = 10                         # how many of its latest commits are read for suspects
fault_check = true                   # ask `claude -p` whether one of your commits broke it
model = "sonnet"
budget_usd = "0.50"
timeout_secs = 180
recheck_mins = 30.0                  # decide an unsure break again; alert again when the fix task finished and it's still red
start_fix = true                     # start the fix task at once in a new terminal (false: it waits in the queue)
fix_ticket = true                    # make a new Jira ticket for the fix task (when Jira is on)

# One table per watched project, by its name. Every key is optional.
# [master.projects.webapp]
# branch = "main"                     # default: the repo's default branch (from the host)
# repo = "acme/webapp"                # default: from the project's origin remote
# host = "github"                     # github or bitbucket; default: from the remote

# Context limits for the board's agents. `tb limits` changes them on the board; these are where it
# starts. 0 turns one off.
[limits]
compact_window = 150000              # tokens: Claude compacts a board terminal's conversation here (--settings autoCompactWindow)
cold_idle_mins = 60                  # a conversation idle longer is compacted before it's resumed
warm_tokens = 60000                  # a task or PR conversation resumes only under this many tokens…
warm_idle_mins = 60                  # …and idle under this long; otherwise it starts fresh from the handoff
# Generated files, marked `-diff` in a block the board keeps in each active project's (and
# worktree's) .git/info/attributes, so agents' diffs skip them. `tb limits --generated` changes them.
generated = []                       # example: ["*.g.dart", "*.freezed.dart", "Cargo.lock"]
# [limits.project_generated]
# webapp = ["dist/**", "*.min.js"]   # example: one project's own, on top of `generated`

# Files `tb attach` refuses (writing goes up as a brief artifact, not a loose file). `{ext}` in the
# message is the refused extension. Links (https://…) are never refused.
[attachments]
refuse = [".md", ".txt", ".rst", ".html"]
refuse_message = "The board doesn't take {ext} files as attachments: publish it as a brief artifact and attach that link."

# Terminals the board opens in Midna. `background`: the job purposes whose terminals open in Midna's
# Background group instead of their project's tabs: start (a task), pr (a PR visit), plan (planning a
# goal), reopen (a closed terminal reopened), jira_desk (the Jira desk's terminal).
[terminals]
background = ["jira_desk"]           # example: ["jira_desk", "plan"]

# The comment guard: agents may not add code comments. A PreToolUse hook refuses an Edit, Write,
# MultiEdit or NotebookEdit that adds one, and the board refuses the PR, `tb pr wait` and `tb done`
# while the branch adds any. A comment whose text starts with a pragma is fine.
[comments]
guard = false
languages = ["rust", "dart", "python", "typescript", "javascript", "swift", "kotlin", "go", "java", "c", "cpp", "csharp", "ruby", "shell"]
# pragmas = ["!/", "noqa", "type:", "pragma", "pylint:", "eslint-", "@ts-", "prettier-ignore", "ignore:", "ignore_for_file:", "nolint", "go:", "swiftlint:", …]

# `tb done "<summary>" --pr-body FILE`: the board checks the description and the branch, then opens the PR
# (GitHub or Bitbucket, by the remote) into the real base: a stacked task's parent branch, else the default branch.
# `tb pr body-check FILE` runs the description check alone.
[pr_body]
sections = ["Summary", "Changes", "Testing"]   # `## <name>` sections it needs, in this order
bullets = ["Changes", "Testing"]               # sections that are bullet lists
max_paragraph = 400                  # longest paragraph in characters; 0 for no limit
no_board_refs = true                 # refuse T12 / G3 / B7 and "task board"
forbid = []                          # more regexes it mustn't match (case-insensitive), e.g. a review tool's name
rebased = true                       # the branch must sit on <remote>/<base> with no merge commits
require_ticket = false               # refuse a task with no Jira ticket
title_prefix = true                  # "ABC-12 Add login"
context = true                       # add a "## Context" section: ticket, the PR it stacks on, evidence, design links
remote = "origin"

# Jira (optional). Off while `site` or `project` is empty. The token comes from `token`,
# env TASKBOARD_JIRA_TOKEN, or the macOS Keychain item below (account = email). No token? Set via = "claude":
# each Jira op then runs through a headless `claude -p` that may use only the Atlassian connector's tools.
[jira]
site = ""                            # example: "acme.atlassian.net"
project = ""                         # example: "PROJ"
email = ""
token = ""
keychain_item = "taskboard-jira"
assignee_account_id = ""
task_type = "Task"
bug_type = "Bug"
epic_type = "Epic"
labels = []
in_progress = "In Progress"
in_review = "In Review"
done = ""                            # status for a finished task without a PR; empty = leave it
merged = ""                          # status once its PR merges, e.g. "Ready for QA"; empty = leave it
via = "rest"                         # "rest" (the API token) or "claude" (the Atlassian connector through claude -p)
claude_tools = ["mcp__claude_ai_Atlassian_MCP", "mcp__atlassian"]   # the connector's tools, for via = "claude" and the desk:
                                     # the claude.ai Atlassian connector, and a local Atlassian MCP server
claude_model = "haiku"               # Jira ops are mechanical: a small model
qa_poll_mins = 0                     # minutes between QA's checks for new comments; 0 = 5 over REST, 30 through Claude
claude_budget_usd = "0.50"
claude_timeout_secs = 180
auto_ticket = false                  # every queued or working task in a project with PRs gets a ticket, and waits for it
desk = false                         # new tickets go to the Jira desk: a Claude terminal in Midna's Background group
                                     # that searches for an open ticket covering the work before it makes one
desk_dir = ""                        # the desk's folder; empty = the board's data folder
default_product = ""                 # a ticket's product when its goal has none and the work's words pick none
canceled = ""                        # status when a task finishes without its PR (tb done --no-pr), with the
                                     # reason as a comment, e.g. "Withdrawn"; empty = like any task without a PR

# Products decide the labels, components and extra fields on a goal's tickets (`tb goal set G1 --product web`).
# A goal with none gets the product its work best matches by `what` (Claude or the desk picks it), or default_product.
# [jira.products.web]
# what = "the customer-facing web app"
# labels = ["web"]
# components = ["Frontend"]
# fields = { customfield_10001 = { id = "team-uuid" } }

# What every handoff adds. `branch` names the branch a task's PR goes on: {type} (feat, or fix for a backlog
# bug), {key} (its Jira key; dropped with the separator after it when there's none), {slug} (from the title),
# {task} (T12) and {n} (12). Empty: the repo's own convention. A goal's own setup (`tb goal setup`) can override it.
[handoff]
footer = ""                          # example: "Code style: follow ~/code-style.md."
footer_file = ""                     # example: "~/.config/taskboard/handoff-footer.md" (read for every handoff)
branch = ""                          # example: "{type}/{key}-{slug}"
# The device pool (`tb devices`, `tb device add pixel-7 --tag android`). A device's own focus command
# (`tb device add … --focus "…"`) raises its window; this one is for devices without their own.
# Run with `sh -c`; {name} (and $TASKBOARD_DEVICE) is the device's name. Empty: no focus for those.
[devices]
focus = ""                           # example: "open -a Simulator"
focus_timeout_secs = 15.0

# Bits (feature flags, `tb bit add newCheckout --backend --task T4`). Tasks build behind a flag whether or
# not it's made; a goal whose tasks are done waits until its backend bits are made in the flag tool
# (`tb bit made`, or "Mark created" on the goal page, which links each one to the tool's new-flag page).
[bits]
tool = ""                            # its name, as the app says it ("Create in Flagsmith"); empty = "the flag tool"
create_url = ""                      # example: "https://flags.example.com/new?key={name}&project={project}"

# Who reviews a PR (`tb pr reviewers` with no names, and the `ask` stage): `count` people from the
# project's roster (`tb reviewers`), one a main contributor of the changed files, the rest in turn.
# A reviewer is due at their last ask + open asks x turn_gap_hours / weight; weight = automation level
# x speed, from their median review time in work minutes.
[reviewers]
count = 2
main_contributors = 3                 # the main-contributor pick comes from this many top authors of the changed files
history_months = 6                    # commit history that counts
min_commits = 5                       # commits in that window to join the roster from the history
turn_gap_hours = 4.0
speed_by_minutes = [[30, 3.0], [60, 2.0], [120, 1.5], [240, 1.0], [480, 0.75]]   # [work minutes up to, speed]
slow_speed = 0.5                      # slower than the last step
no_speed_yet = 1.0                    # hasn't reviewed yet
speed_days = 14.0                     # speed comes from the asks of the last this many days
speed_asks = 8                        # and at most this many of them
slow_cap_mins = 240.0                 # a swapped-off ask counts as this; an open one as its time so far, up to this
me = []                               # your own names, emails and host ids (the PR's author is never asked anyway)
sync_every_hours = 12.0               # how often commit authors and host accounts join the roster
# Who's around (optional): with availability = "slack" the picker checks candidates on Slack with
# Taskboard's Slack account (read-only: it never messages anyone) during your work hours, and prefers
# online (active or posted today) > quiet > off (outside local_start-local_end where they are, or a
# weekend); a status matching out_pattern is never picked.
availability = ""                     # "" or "slack"
pick_tries = 6                        # candidates checked per pick
out_pattern = '(?i)\b(out|ooo|off|vacation|holiday|pto|sick|leave)\b|🌴|🤒|🏖'
local_start = "08:00"
local_end = "18:00"
weekends_off = true
drop_not_on_slack = true              # someone Slack doesn't know (by email, name or email prefix) leaves the roster (tb reviewers back undoes it)
quiet_from = "10:00"                  # away with no post today is quiet only from this time where they are
out_keeps_hours = 24.0                # after hours, an out status seen this recently still holds
cache_mins = 10.0
# Review bots (`tb reviewers bot <who> --every <hours> --mark <text>`): a run is spotted from the marker
# in that person's comments on the board's PRs; once its schedule is known they're asked only when it
# runs within bot_due_mins, at the fastest pace.
bot_window_hours = 12.0               # marked comments this recent count
bot_run_gap_mins = 30.0               # marked comments this close together are one run
bot_due_mins = 45.0
# Swaps: a reviewer asked who hasn't reviewed after swap_after_mins work minutes is replaced through the
# PR host by the picker's choice (only inside work hours). Someone swapped off who reviews anyway counts
# again and their stand-in is taken off; one who asks for changes doesn't block, and one more person is asked.
swap = false
swap_after_mins = 90.0
# The ask stage: after you mark a green PR reviewed, it waits until reviewers are asked. The agent is
# brought back to ask (tb pr reviewers); outside work hours (or with pr.wake off) the board asks itself.
ask_stage = false
ask_retry_waits = [60, 300, 900]      # seconds between the board's tries when it can't ask

# Your own steps before a project's PR opens (before = "pr", the default) or before its task finishes
# (before = "done"). Agent work has a `prompt` (and optionally a `check` script that must exit 0); a
# script step has `run`; your own has `owner = true` and maybe an `open` link, and the task waits in
# Needs you. Placeholders: {task} {title} {project} {repo} {branch} {base} {base_ref} {pr_url} {jira};
# {base} is the PR's real base (a stacked task's parent branch) and {base_ref} has the remote on it
# (origin/main). The board refuses the PR and `tb done` until they pass. A step with per_head = true passes
# once per head commit (every push is checked again, and a push to the open PR waits for it);
# min_gap_mins keeps its rounds apart; bar = "WD" shows it in the app's PR bar. A check can write its
# verdict, headline and findings to $TASKBOARD_RESULT. See docs/HOOKS.md ("Steps").
# [[steps]]
# name = "Author-side review"
# projects = "work-app|work-api"
# prompt = "Run /author-review on {branch} against {base_ref}, and fix what it finds."
# check = "author-review --since {base_ref} --result $TASKBOARD_RESULT"
# per_head = true
# min_gap_mins = 10
# bar = "WD"
#
# [[steps]]
# name = "Lint and unit tests"
# run = "make lint test"
# timeout = 900
#
# [[steps]]
# name = "Design sign-off"
# owner = true
# open = "https://figma.com/file/abc?branch={branch}"
# prompt = "Sign off the screens this task changes."
